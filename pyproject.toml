[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ztf-classifier"
version = "0.4.0"
description = "Machine-learning classification of astronomical transient and variable objects using ZTF light curves."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Proprietary"}
keywords = ["astronomy", "ZTF", "machine-learning", "transient-classification", "astronomical-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

authors = [
    {name = "Alpha Team"}
]
maintainers = [
    {name = "Alpha Team"}
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "astropy",
    "astroquery",
    "alerce==2.3.1",
    "pyarrow",
    "scikit-learn",
    "joblib",
    "xgboost",
    "lightgbm",
    "shap",
    "requests",
]

[project.scripts]
ztf-classifier = "ztf_classifier.cli.main:main"

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel",
]
web = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.53.0,<0.54",
    "plotly",
    "streamlit",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
    "pip-audit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
