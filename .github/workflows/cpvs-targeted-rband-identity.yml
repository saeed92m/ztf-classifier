name: CPVS Targeted r-Band Identity Discovery

on:
  push:
    branches:
      - research/cpvs-seq-identity-20261104
    paths:
      - .github/workflows/cpvs-targeted-rband-identity.yml
      - scripts/diagnose_cpvs_rband_identity.py
      - tests/test_cpvs_rband_identity.py
      - configs/process/cycles/cpvs-rband-identity-20261107.json
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cpvs-targeted-rband-identity.yml"
      - "scripts/diagnose_cpvs_rband_identity.py"
      - "tests/test_cpvs_rband_identity.py"
      - "configs/process/cycles/cpvs-rband-identity-20261107.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpvs-targeted-rband-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targeted-r-archive-scan:
    name: Discover r-band evidence for Seq 615170 and 615172
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked project dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock

      - name: Run synthetic regression tests
        run: python -m pytest -q tests/test_cpvs_rband_identity.py

      - name: Download checksum-pinned Zenodo r archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            --output "$RUNNER_TEMP/ztf2r.zip" \
            "https://zenodo.org/records/3886372/files/ztf2r.zip?download=1"

      - name: Scan r-band archive
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diagnose_cpvs_rband_identity.py \
            --archive "$RUNNER_TEMP/ztf2r.zip" \
            --target-seq 615170 \
            --orphan-seq 615172 \
            --output "$RUNNER_TEMP/cpvs_rband_identity_discovery.json"

      - name: Upload bounded discovery report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-rband-identity-discovery
          path: ${{ runner.temp }}/cpvs_rband_identity_discovery.json
          if-no-files-found: warn
          retention-days: 30
