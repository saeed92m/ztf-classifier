name: Independent ZTF Catalog and Light-Curve Validation

on:
  push:
    branches:
      - validation/ic10-independent-catalog-20261020
    paths:
      - "scripts/validation/ic10_independent_catalog_smoke.py"
      - "scripts/validation/ic10_catalog_numeric_consistency.py"
      - "scripts/validation/ic10_catalog_join_diagnostics.py"
      - "scripts/validation/ic10_raw_photometry_reproduction.py"
      - "scripts/validation/bts_raw_lightcurve_smoke.py"
      - ".github/workflows/ic10-independent-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-ztf-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Verify independent catalogs and raw light curve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install minimal scientific dependencies
        id: install_deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy pandas scipy astropy pyarrow
          python -m pip install -e . --no-deps

      - name: Verify independent IC 10 published catalog
        run: |
          set -o pipefail
          python scripts/validation/ic10_independent_catalog_smoke.py | tee ic10-validation-report.json

      - name: Compare published IC 10 color and single-OID band photometry
        run: |
          set -o pipefail
          python scripts/validation/ic10_catalog_numeric_consistency.py | tee ic10-numeric-consistency-report.json

      - name: Diagnose IC 10 SourceID/OID multiplicity and eligible comparison set
        run: |
          set -o pipefail
          python scripts/validation/ic10_catalog_join_diagnostics.py | tee ic10-join-diagnostics-report.json

      - name: Recompute IC 10 raw photometry summaries from IRSA light curves
        run: |
          set -o pipefail
          python scripts/validation/ic10_raw_photometry_reproduction.py | tee ic10-raw-photometry-report.json

      - name: Verify raw ZTF BTS light curve through frozen v0.2 feature engine
        if: always() && steps.install_deps.outcome == 'success'
        run: |
          set -o pipefail
          python scripts/validation/bts_raw_lightcurve_smoke.py | tee bts-lightcurve-validation-report.json

      - name: Upload reproducible validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: independent-ztf-validation-reports
          path: |
            ic10-validation-report.json
            ic10-numeric-consistency-report.json
            ic10-join-diagnostics-report.json
            ic10-raw-photometry-report.json
            bts-lightcurve-validation-report.json
          if-no-files-found: ignore
          retention-days: 14
