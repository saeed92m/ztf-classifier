name: CPVS Raw CDS Reconciliation

on:
  push:
    branches:
      - investigation/cpvs-candidate-field-audit-20261030
    paths:
      - scripts/cpvs_raw_cds_reconciliation.py
      - .github/workflows/cpvs-raw-cds-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  raw-catalog-reconciliation:
    name: Download original CDS files and cross-check publisher MRT rows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reviewed investigation branch
        uses: actions/checkout@v4

      - name: Download original CDS archives from official NAOJ VizieR mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/raw work/refs/zenodo work/refs/heavy work/refs/publisher work/output
          : > work/raw/retrieval_sources.tsv
          : > work/raw/download.log

          fetch_file() {
            local url="$1"
            local destination="$2"
            local tmp="${destination}.part"
            echo "Downloading ${url}" | tee -a work/raw/download.log
            curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 20 --max-time 900 \
              -H 'Accept-Encoding: identity' "${url}" -o "${tmp}" \
              2>>work/raw/download.log
            test -s "${tmp}"
            mv "${tmp}" "${destination}"
            printf '%s\t%s\n' "$(basename "${destination}")" "${url}" >> work/raw/retrieval_sources.tsv
          }

          fetch_file "http://vizier.nao.ac.jp/ftp/cats/J/ApJS/249/18/table2.dat.gz" "work/raw/table2.dat.gz"
          fetch_file "http://vizier.nao.ac.jp/ftp/cats/J/ApJ/932/118/table4.dat.gz" "work/raw/table4.dat.gz"
          fetch_file "http://vizier.nao.ac.jp/ftp/cats/J/ApJS/249/18/ReadMe" "work/raw/table2.ReadMe"
          fetch_file "http://vizier.nao.ac.jp/ftp/cats/J/ApJ/932/118/ReadMe" "work/raw/table4.ReadMe"

          gzip -t work/raw/table2.dat.gz
          gzip -t work/raw/table4.dat.gz
          gzip -dc work/raw/table2.dat.gz > work/raw/table2.dat
          gzip -dc work/raw/table4.dat.gz > work/raw/table4.dat

          echo "=== Verify decompressed CDS payload SHA-256 ==="
          printf '%s  %s\n' \
            "2c77c5b6c14811f6abab6e1442ce82c6fb54dbdcfc141954165704fecfcb3881" \
            "work/raw/table2.dat" | sha256sum -c -
          printf '%s  %s\n' \
            "4fa96379d47f851db7ecd80a83986d82201e8718f12ab727b5348a3914374e7d" \
            "work/raw/table4.dat" | sha256sum -c -
          printf '%s  %s\n' \
            "e57991d9e086155b9da14eaca7a6abc46a876a2dce58b397a90c915ec309e24a" \
            "work/raw/table2.ReadMe" | sha256sum -c -
          printf '%s  %s\n' \
            "0a7ec0dac13b155fdd63322dc9b0230de42fd05169e0e02c70f68fce0bc67d6a" \
            "work/raw/table4.ReadMe" | sha256sum -c -

          echo "=== Original CDS file byte counts ==="
          wc -c work/raw/table2.dat work/raw/table4.dat
          echo "=== Original CDS file record counts ==="
          wc -l work/raw/table2.dat work/raw/table4.dat
          echo "=== All raw source hashes ==="
          sha256sum work/raw/*

      - name: Retrieve frozen Zenodo membership and historical candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41299576448 --repo saeed92m/ztf-classifier \
            --name cpvs-full-zenodo-membership-crosswalk --dir work/refs/zenodo
          gh run download 38635891449 --repo saeed92m/ztf-classifier \
            --name scientific-validation-heavy --dir work/refs/heavy
          gh run download 41357833854 --repo saeed92m/ztf-classifier \
            --name cpvs-primary-source-reconciliation --dir work/refs/publisher
          test -s work/refs/zenodo/published_membership_seq.tsv
          test -s work/refs/heavy/ztf_periodic_730k/selected.tsv
          test -s work/refs/heavy/ztf_periodic_730k/selection_diagnostics.json
          test -s work/refs/publisher/raw/table2.mrt.txt
          test -s work/refs/publisher/raw/table4.mrt.txt

      - name: Run byte-preserving identifier and membership reconciliation
        run: |
          python scripts/cpvs_raw_cds_reconciliation.py \
            --raw work/raw \
            --zenodo work/refs/zenodo \
            --heavy work/refs/heavy \
            --publisher work/refs/publisher \
            --out work/output

      - name: Upload immutable CDS sources and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpvs-raw-cds-reconciliation
          path: |
            work/raw/
            work/output/
          if-no-files-found: warn
          retention-days: 90
