name: CPVS Raw CDS Reconciliation

on:
  push:
    branches:
      - investigation/cpvs-candidate-field-audit-20261030
    paths:
      - scripts/cpvs_raw_cds_reconciliation.py
      - .github/workflows/cpvs-raw-cds-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  raw-catalog-reconciliation:
    name: Download original CDS files and cross-check publisher MRT rows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reviewed investigation branch
        uses: actions/checkout@v4

      - name: Generate Ruff-formatted audit source copies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.9
          python -m ruff format scripts/cpvs_raw_cds_reconciliation.py tests/test_cpvs_raw_cds_reconciliation.py
          mkdir -p work/formatted
          cp scripts/cpvs_raw_cds_reconciliation.py work/formatted/
          cp tests/test_cpvs_raw_cds_reconciliation.py work/formatted/

      - name: Commit formatting-only audit source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/cpvs_raw_cds_reconciliation.py tests/test_cpvs_raw_cds_reconciliation.py; then
            echo "Audit source files are already Ruff-formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cpvs_raw_cds_reconciliation.py tests/test_cpvs_raw_cds_reconciliation.py
          git commit -m "style: format CPVS raw reconciliation audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Reuse immutable raw CDS sources from the verified acquisition run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/raw work/refs/zenodo work/refs/heavy work/refs/publisher work/refs/raw-prior work/output

          # Reuse the successful raw-source artifact. Do not fetch or transform
          # the large catalog files again.
          gh run download 41358513968 --repo saeed92m/ztf-classifier \
            --name cpvs-raw-cds-reconciliation --dir work/refs/raw-prior
          cp -a work/refs/raw-prior/raw/. work/raw/

          printf '%s  %s\n' \
            "2c77c5b6c14811f6abab6e1442ce82c6fb54dbdcfc141954165704fecfcb3881" \
            "work/raw/table2.dat" | sha256sum -c -
          printf '%s  %s\n' \
            "4fa96379d47f851db7ecd80a83986d82201e8718f12ab727b5348a3914374e7d" \
            "work/raw/table4.dat" | sha256sum -c -
          printf '%s  %s\n' \
            "e57991d9e086155b9da14eaca7a6abc46a876a2dce58b397a90c915ec309e24a" \
            "work/raw/table2.ReadMe" | sha256sum -c -
          printf '%s  %s\n' \
            "0a7ec0dac13b155fdd63322dc9b0230de42fd05169e0e02c70f68fce0bc67d6a" \
            "work/raw/table4.ReadMe" | sha256sum -c -
          test -s work/raw/table2.dat.gz
          test -s work/raw/table4.dat.gz
          test -s work/raw/retrieval_sources.tsv

      - name: Retrieve frozen Zenodo membership and historical candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41299576448 --repo saeed92m/ztf-classifier \
            --name cpvs-full-zenodo-membership-crosswalk --dir work/refs/zenodo
          gh run download 38635891449 --repo saeed92m/ztf-classifier \
            --name scientific-validation-heavy --dir work/refs/heavy
          gh run download 41357833854 --repo saeed92m/ztf-classifier \
            --name cpvs-primary-source-reconciliation --dir work/refs/publisher
          test -s work/refs/zenodo/published_membership_seq.tsv
          test -s work/refs/heavy/ztf_periodic_730k/selected.tsv
          test -s work/refs/heavy/ztf_periodic_730k/selection_diagnostics.json
          test -s work/refs/publisher/raw/table2.mrt.txt
          test -s work/refs/publisher/raw/table4.mrt.txt

      - name: Run byte-preserving identifier and membership reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cpvs_raw_cds_reconciliation.py \
            --raw work/raw \
            --zenodo work/refs/zenodo \
            --heavy work/refs/heavy \
            --publisher work/refs/publisher \
            --out work/output 2>&1 | tee work/output/audit.log

      - name: Upload immutable CDS sources and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpvs-raw-cds-reconciliation
          path: |
            work/raw/
            work/output/
            work/formatted/
          if-no-files-found: warn
          retention-days: 90
