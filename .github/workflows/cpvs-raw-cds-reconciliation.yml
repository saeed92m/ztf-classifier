name: CPVS Primary-source Reconciliation

on:
  push:
    branches:
      - investigation/cpvs-candidate-field-audit-20261030
    paths:
      - scripts/cpvs_raw_cds_reconciliation.py
      - .github/workflows/cpvs-raw-cds-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  raw-catalog-reconciliation:
    name: Download original publisher MRT files and reconcile membership
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reviewed investigation branch
        uses: actions/checkout@v4

      - name: Download original publisher machine-readable tables without transformation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/raw work/refs/zenodo work/refs/heavy work/output
          : > work/raw/retrieval_sources.tsv
          : > work/raw/download.log

          fetch_source_file() {
            local url="$1"
            local destination="$2"
            local tmp="${destination}.part"
            echo "Downloading ${url}" | tee -a work/raw/download.log
            curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -H 'Accept-Encoding: identity' "${url}" -o "${tmp}" \
              2>>work/raw/download.log
            test -s "${tmp}"
            if head -c 64 "${tmp}" | grep -Eqi '<!doctype|<html'; then
              echo "Rejected HTML response: ${url}" | tee -a work/raw/download.log
              rm -f "${tmp}"
              return 1
            fi
            mv "${tmp}" "${destination}"
            printf '%s\t%s\n' "$(basename "${destination}")" "${url}" >> work/raw/retrieval_sources.tsv
            echo "Downloaded ${destination}" | tee -a work/raw/download.log
          }

          fetch_source_file \
            "https://content.cld.iop.org/journals/0067-0049/249/1/18/revision1/apjsab9caet2_mrt.txt" \
            "work/raw/table2.mrt.txt"
          fetch_source_file \
            "https://content.cld.iop.org/journals/0004-637X/932/2/118/revision1/apjac69d4t4_mrt.txt" \
            "work/raw/table4.mrt.txt"

          echo "=== Publisher source byte counts ==="
          wc -c work/raw/table2.mrt.txt work/raw/table4.mrt.txt
          echo "=== Publisher source SHA-256 ==="
          sha256sum work/raw/table2.mrt.txt work/raw/table4.mrt.txt

      - name: Retrieve frozen Zenodo membership and historical candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41299576448 --repo saeed92m/ztf-classifier \
            --name cpvs-full-zenodo-membership-crosswalk --dir work/refs/zenodo
          gh run download 38635891449 --repo saeed92m/ztf-classifier \
            --name scientific-validation-heavy --dir work/refs/heavy
          test -s work/refs/zenodo/published_membership_seq.tsv
          test -s work/refs/heavy/ztf_periodic_730k/selected.tsv
          test -s work/refs/heavy/ztf_periodic_730k/selection_diagnostics.json

      - name: Run byte-preserving identifier and membership reconciliation
        run: |
          python scripts/cpvs_raw_cds_reconciliation.py \
            --raw work/raw \
            --zenodo work/refs/zenodo \
            --heavy work/refs/heavy \
            --out work/output

      - name: Upload immutable publisher sources and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpvs-primary-source-reconciliation
          path: |
            work/raw/
            work/output/
          if-no-files-found: warn
          retention-days: 90
