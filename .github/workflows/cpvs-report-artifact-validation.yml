name: CPVS Source-Backed Report Validation

on:
  workflow_run:
    workflows: ["Scientific Validation"]
    types: [completed]
    branches:
      - "ci/heavy/cpvs-seq-authoritative-ids-20261026"

permissions:
  actions: read
  contents: read

jobs:
  build-and-verify-report:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'ci/heavy/cpvs-seq-authoritative-ids-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Download source-backed scientific-validation artifact
        uses: actions/download-artifact@v7
        with:
          name: scientific-validation-heavy
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: source-artifact

      - name: Locate and verify required source inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          parent="$(find source-artifact -type f -path '*/ztf_periodic_781k/Table2.txt.zip' -print -quit)"
          candidate="$(find source-artifact -type f -path '*/ztf_periodic_730k/selected.tsv' -print -quit)"
          published="$(find source-artifact -type f -path '*/ztf_periodic_730k/published_table4.dat' -print -quit)"
          test -n "$parent" && test -s "$parent"
          test -n "$candidate" && test -s "$candidate"
          test -n "$published" && test -s "$published"
          test -s "$parent.evidence.json"
          test -s "$candidate.evidence.json"
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'published=%s\n' "$published" >> "$GITHUB_OUTPUT"
          sha256sum "$parent" "$parent.evidence.json" "$candidate" "$candidate.evidence.json" "$published"

      - name: Generate source-backed CPVS discrepancy report
        run: |
          set -euo pipefail
          python scripts/build_cpvs_discrepancy_report.py \
            --parent-metadata "${{ steps.inputs.outputs.parent }}" \
            --candidate-ids "${{ steps.inputs.outputs.candidate }}" \
            --published-ids "${{ steps.inputs.outputs.published }}" \
            --output-dir reports/cpvs_report_validation/cpvs_discrepancy_report \
            --source-revision "${{ github.event.workflow_run.head_sha }}" \
            --report-code-revision "${{ github.sha }}" \
            --expected-parent-count 781602

      - name: Verify report counts and provenance hashes
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
          REPORT_CODE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("reports/cpvs_report_validation/cpvs_discrepancy_report")
          manifest = json.loads((root / "cpvs_discrepancy_manifest.json").read_text(encoding="utf-8"))
          if manifest.get("report_code_revision") in (None, "", "UNRECORDED"):
              raise SystemExit("Report-builder code revision is missing")
          if manifest.get("source_revision") != os.environ["SOURCE_REVISION"]:
              raise SystemExit("Source revision does not match the producing workflow commit")
          if manifest.get("report_code_revision") != os.environ["REPORT_CODE_REVISION"]:
              raise SystemExit("Report-builder revision does not match the workflow commit")
          counts = manifest["counts"]
          expected_baseline = {
              "parent_metadata_objects": 781602,
              "candidate_objects": 741786,
              "published_reference_objects": 730184,
              "intersection_objects": 730184,
              "candidate_only_objects": 11602,
              "published_only_objects": 0,
          }
          baseline_comparison = {
              key: {
                  "expected": expected,
                  "observed": counts.get(key),
                  "matches": counts.get(key) == expected,
              }
              for key, expected in expected_baseline.items()
          }
          if counts.get("parent_metadata_objects") != 781602:
              raise SystemExit("Authoritative CPVS Table 2 parent row count changed")
          if counts.get("intersection_objects", -1) > min(
              counts.get("candidate_objects", 0),
              counts.get("published_reference_objects", 0),
          ):
              raise SystemExit("Impossible CPVS membership intersection count")
          if counts.get("candidate_only_objects") != (
              counts.get("candidate_objects") - counts.get("intersection_objects")
          ):
              raise SystemExit("Candidate-only count is inconsistent with set counts")
          if counts.get("published_only_objects") != (
              counts.get("published_reference_objects") - counts.get("intersection_objects")
          ):
              raise SystemExit("Published-only count is inconsistent with set counts")
          if counts.get("candidate_only_missing_parent_provenance") != 0:
              raise SystemExit("Some candidate-only IDs lack parent provenance")
          with (root / "cpvs_candidate_only_objects.csv").open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream))
          ids = [row.get("SourceID", "") for row in rows]
          if len(ids) != counts.get("candidate_only_objects") or len(set(ids)) != len(ids):
              raise SystemExit("Report CSV row count/uniqueness disagrees with the computed candidate-only set")
          for name, record in manifest["source_files"].items():
              source = Path(record["path"])
              if not source.is_file() or hashlib.sha256(source.read_bytes()).hexdigest() != record["sha256"]:
                  raise SystemExit(f"Source hash verification failed: {name}")
          for name, record in manifest["outputs"].items():
              output = root / record["path"]
              if not output.is_file() or hashlib.sha256(output.read_bytes()).hexdigest() != record["sha256"]:
                  raise SystemExit(f"Output hash verification failed: {name}")
          if manifest["interpretation"]["historical_publisher_rule"] != "UNRESOLVED":
              raise SystemExit("Report must preserve unresolved historical publisher rule")
          print(json.dumps({
              "status": "REPORT_VERIFIED",
              "counts": counts,
              "historical_count_baseline_match": all(
                  item["matches"] for item in baseline_comparison.values()
              ),
              "baseline_comparison": baseline_comparison,
              "source_hashes_verified": len(manifest["source_files"]),
              "output_hashes_verified": len(manifest["outputs"]),
              "historical_publisher_rule": "UNRESOLVED",
              "discovery_claim": "none",
          }, indent=2, sort_keys=True))
          PY

      - name: Upload verified CPVS discrepancy report
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-source-backed-discrepancy-report
          path: reports/cpvs_report_validation/cpvs_discrepancy_report/**
          if-no-files-found: error
          retention-days: 90
