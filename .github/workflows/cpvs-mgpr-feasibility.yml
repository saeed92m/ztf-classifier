name: CPVS MGPR robustness diagnostic

on:
  push:
    branches:
      - research/cpvs-snr-formula-audit-20261112
    paths:
      - scripts/diagnose_cpvs_mgpr.py
      - tests/test_cpvs_mgpr.py
      - .github/workflows/cpvs-mgpr-feasibility.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpvs-mgpr-feasibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mgpr-feasibility:
    name: Fit MGPR for 17 residuals and 17 matched Table 4 controls
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned research runtime
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install numpy==2.4.6 scipy==1.17.1 george==0.4.4

      - name: Download pinned full-parent evidence
        uses: actions/download-artifact@v4
        with:
          name: scientific-validation-heavy
          path: inputs
          repository: ${{ github.repository }}
          run-id: 38635891449
          github-token: ${{ github.token }}

      - name: Run MGPR preparation tests
        run: python -m unittest discover -s tests -p "test_cpvs_mgpr.py" -v


      - name: Download checksum-pinned Zenodo raw photometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw reports
          curl --fail --location --retry 4 --retry-all-errors \
            "https://zenodo.org/records/3886372/files/ztf2g.zip?download=1" \
            --output raw/ztf2g.zip
          curl --fail --location --retry 4 --retry-all-errors \
            "https://zenodo.org/records/3886372/files/ztf2r.zip?download=1" \
            --output raw/ztf2r.zip
          echo "47cd1823b3ccdb69fa3085381cf63ff0605f6d841fc3bc37489dce023ddc19b9  raw/ztf2g.zip" | sha256sum --check -
          echo "48331ba1157afc993a1399e094b97752a82d8d0f736d2fdf63fd7b2a82281b74  raw/ztf2r.zip" | sha256sum --check -
          df -h .

      - name: Run multi-start MGPR and blocked-phase robustness audit
        run: |
          python scripts/diagnose_cpvs_mgpr.py \
            --input-dir inputs \
            --g-archive raw/ztf2g.zip \
            --r-archive raw/ztf2r.zip \
            --output-dir reports

      - name: Upload MGPR evidence
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-mgpr-robustness-evidence
          path: |
            reports/cpvs_mgpr_feasibility_report.json
            reports/cpvs_mgpr_object_metrics.jsonl
            reports/cpvs_mgpr_interpolated_curves.tsv
          if-no-files-found: error
          retention-days: 14
