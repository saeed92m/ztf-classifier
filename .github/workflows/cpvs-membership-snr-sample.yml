name: CPVS Membership Raw SNR Sample Re-derivation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cpvs-membership-snr-sample.yml"
      - "scripts/diagnose_cpvs_membership_snr_sample.py"
      - "tests/test_cpvs_membership_snr_sample.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpvs-membership-raw-snr-sample
  cancel-in-progress: false

jobs:
  raw-snr-sample-rederivation:
    name: Re-derive raw g/r SNR for fixed samples and residual IDs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out reviewed investigation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependency
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          command -v unzip
          command -v gh

      - name: Run synthetic regression tests
        run: python -m pytest -q tests/test_cpvs_membership_snr_sample.py

      - name: Retrieve immutable candidate and sample inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/refs reports
          gh run download 41367972395 --repo saeed92m/ztf-classifier \
            --name cpvs-raw-cds-reconciliation --dir work/refs
          for file in \
            output/candidate_only_11602_object_provenance.tsv \
            output/fixed_sample_100.tsv \
            output/fixed_sample_1000.tsv \
            output/four_field_only_55.tsv; do
            test -s "work/refs/$file"
          done

      - name: Download and verify original Zenodo g/r archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/archives
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
            "https://zenodo.org/records/3886372/files/ztf2g.zip?download=1" \
            --output work/archives/ztf2g.zip &
          g_pid=$!
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
            "https://zenodo.org/records/3886372/files/ztf2r.zip?download=1" \
            --output work/archives/ztf2r.zip &
          r_pid=$!
          g_status=0
          r_status=0
          wait "$g_pid" || g_status=$?
          wait "$r_pid" || r_status=$?
          if [ "$g_status" -ne 0 ] || [ "$r_status" -ne 0 ]; then
            echo "g download exit=$g_status"
            echo "r download exit=$r_status"
            exit 1
          fi

          echo "850fcef561dd7407fbe8e19e99100d7a  work/archives/ztf2g.zip" | md5sum --check -
          echo "daa7bc45c67579253eebe6b1c09dfbd9  work/archives/ztf2r.zip" | md5sum --check -
          echo "47cd1823b3ccdb69fa3085381cf63ff0605f6d841fc3bc37489dce023ddc19b9  work/archives/ztf2g.zip" | sha256sum --check -
          echo "48331ba1157afc993a1399e094b97752a82d8d0f736d2fdf63fd7b2a82281b74  work/archives/ztf2r.zip" | sha256sum --check -
          sha256sum work/archives/ztf2g.zip work/archives/ztf2r.zip | tee reports/source_archive_sha256.txt

      - name: Re-derive SNR for residual IDs, controls and fixed samples
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diagnose_cpvs_membership_snr_sample.py \
            --g-archive work/archives/ztf2g.zip \
            --r-archive work/archives/ztf2r.zip \
            --candidate-only work/refs/output/candidate_only_11602_object_provenance.tsv \
            --sample-100 work/refs/output/fixed_sample_100.tsv \
            --sample-1000 work/refs/output/fixed_sample_1000.tsv \
            --four-field-only work/refs/output/four_field_only_55.tsv \
            --output reports/cpvs_membership_raw_snr_rederivation.json \
            --objects-output reports/cpvs_membership_raw_snr_objects.tsv

      - name: Upload compact scientific audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpvs-membership-raw-snr-sample
          path: |
            reports/
          if-no-files-found: warn
          retention-days: 90
