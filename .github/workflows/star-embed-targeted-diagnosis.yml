name: StarEmbed Targeted Diagnosis (no code change)

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Source run to inspect (39577115285)'
        required: false
        default: '39577115285'
        type: string
      dataset_revision:
        description: 'HF revision, use commit SHA or resolve_at_acquisition'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show initial state
        run: |
          echo "origin/main: $(git rev-parse origin/main | cut -c1-7)"
          echo "HEAD: $(git rev-parse HEAD | cut -c1-7)"
          git log --oneline -3
          gh pr view 212 --json number,headRefOid,state,isDraft | jq . || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact small files only (if available)
        uses: actions/download-artifact@v7
        with:
          name: star-embed-independent-validation
          path: /tmp/star-embed-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.target_run_id }}
        continue-on-error: true

      - name: List artifact contents (low-volume)
        run: |
          echo "=== Artifact download attempt ==="
          ls -R /tmp/star-embed-artifact 2>&1 | head -n 100
          du -sh /tmp/star-embed-artifact 2>&1 | head
          echo "=== Look for small JSONs ==="
          find /tmp/star-embed-artifact -type f -name "*.json" -exec ls -lh {} \; 2>&1 | head -n 30
          for f in $(find /tmp/star-embed-artifact -type f -name "independent_dataset_report.json" -o -name "data.acquisition.json" 2>&1 | head); do
            echo "--- $f ---"
            cat "$f" 2>&1 | head -n 200
            echo "SHA256: $(sha256sum "$f" | cut -d' ' -f1)"
          done

      - name: Install Python deps (locked)
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.0.0 wheel==0.48.0
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install huggingface_hub pyarrow pandas --quiet

      - name: Fetch ONLY train-00001 shard from pinned revision (if artifact insufficient)
        run: |
          set -euo pipefail
          echo "=== Step 2-5: Minimal download ==="
          REVISION="${{ inputs.dataset_revision }}"
          echo "Requested revision: $REVISION"
          # Resolve actual commit if resolve_at_acquisition used in benchmark json
          CONFIG_REV=$(python -c "import json; print(json.load(open('configs/benchmarks/star_embed_ztf_40k.json'))['input_contract']['revision'])")
          echo "Config revision: $CONFIG_REV"
          if [ "$CONFIG_REV" != "resolve_at_acquisition" ]; then
            REVISION="$CONFIG_REV"
          fi
          echo "Using revision: $REVISION for diagnosis"
          # Use huggingface_hub with revision pinning
          python <<PY
          from huggingface_hub import hf_hub_download, hf_hub_url
          import hashlib, pathlib, json, os
          revision = os.environ.get("REVISION", "${{ inputs.dataset_revision }}")
          # Fallback to config revision
          import json as j
          cfg = j.load(open("configs/benchmarks/star_embed_ztf_40k.json"))
          if cfg["input_contract"]["revision"] != "resolve_at_acquisition":
              revision = cfg["input_contract"]["revision"]
          print(f"Downloading with revision={revision}")
          for fname in ["data/train-00001-of-00002.parquet"]:
              url = hf_hub_url(repo_id="StarEmbed/ZTF_40k", filename=fname, revision=revision)
              print(f"URL: {url}")
              path = hf_hub_download(repo_id="StarEmbed/ZTF_40k", filename=fname, revision=revision)
              print(f"Downloaded: {path} size={pathlib.Path(path).stat().st_size}")
              print(f"SHA256: {hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()}")
          PY
        env:
          REVISION: ${{ inputs.dataset_revision }}

      - name: Diagnose shard — counts & grain
        run: |
          set -euo pipefail
          echo "=== Step 4-5: Counts & grain ==="
          # Find the downloaded file (HF cache)
          HF_FILE=$(find ~/.cache/huggingface -name "train-00001-of-00002.parquet" 2>/dev/null | head -n1)
          if [ -z "$HF_FILE" ]; then
            # Try alternative artifact path if downloaded
            HF_FILE=$(find /tmp/star-embed-artifact -name "train-00001-of-00002.parquet" 2>/dev/null | head -n1)
          fi
          if [ -z "$HF_FILE" ]; then
            echo "No parquet file found to diagnose"
            exit 0
          fi
          echo "File: $HF_FILE"
          ls -lh "$HF_FILE"
          sha256sum "$HF_FILE"
          python <<PY
          import pyarrow.parquet as pq
          import pandas as pd
          import json, pathlib, sys, hashlib
          f = pathlib.Path("$HF_FILE".strip())
          # If variable substitution didn't work, find again
          import os, glob
          candidates = glob.glob(os.path.expanduser("~/.cache/huggingface/**/train-00001-of-00002.parquet"), recursive=True)
          if candidates:
              f = pathlib.Path(candidates[0])
          print(f"Analyzing: {f}")
          table = pq.read_table(f)
          print(f"Schema: {table.schema}")
          print(f"Columns: {table.column_names}")
          print(f"Rows: {table.num_rows}")
          df = table.to_pandas()
          print(f"Null sourceid: {df['sourceid'].isna().sum()}")
          print(f"Duplicated rows (sourceid): {df['sourceid'].duplicated().sum()}")
          dup_counts = df['sourceid'].value_counts()
          dups = dup_counts[dup_counts>1]
          print(f"Distinct duplicated IDs: {len(dups)}")
          if len(dups):
              print(dups.head(10).to_string())
              for sid in dups.head(3).index:
                  print(f"--- examples for {sid} ---")
                  print(df[df['sourceid']==sid].head(2).to_string())
          # Check bands_data grain
          sample = df.iloc[0]['bands_data']
          print(f"bands_data sample type: {type(sample)} keys: {sample.keys() if isinstance(sample, dict) else 'not dict'}")
          # Check overlap with other shards if present
          import glob
          other_files = glob.glob("/tmp/star-embed-artifact/**/*.parquet", recursive=True) + glob.glob(os.path.expanduser("~/.cache/huggingface/**/train-*.parquet"), recursive=True)
          print(f"Other shards found: {other_files[:5]}")
          PY

      - name: Check dataset documentation grain
        run: |
          echo "=== Step 5: Documented grain ==="
          cat configs/benchmarks/star_embed_ztf_40k.json | python -m json.tool
          echo "--- Try fetching paper README from HF ---"
          curl -sL https://huggingface.co/datasets/StarEmbed/ZTF_40k/raw/main/README.md 2>&1 | head -n 100 || true

      - name: Upload small diagnosis report only (no raw data)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: star-embed-diagnosis-report
          path: |
            /tmp/star-embed-artifact/**/independent_dataset_report.json
            /tmp/star-embed-artifact/**/data.acquisition.json
            /tmp/pip-report-build.json
          if-no-files-found: warn

