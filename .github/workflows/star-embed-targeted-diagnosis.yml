name: StarEmbed Targeted Diagnosis (evidence-only, no code change)
# Runs in GitHub Runner with full internet — not in restricted sandbox.
# No validator / production code change, no merge / release / baseline change.
on:
  push:
    branches:
      - arena/d3039cf3-ztf-classifier
    paths:
      - .github/workflows/star-embed-targeted-diagnosis.yml
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Source artifact run to inspect (e.g. 39577115285)'
        required: false
        default: '39577115285'
        type: string
      dataset_revision:
        description: 'HF revision — pinned 40-char SHA; fixed to 33046797fb619f93a991aa4e38a9dc36f27e2d24 for failing shard'
        required: false
        default: '33046797fb619f93a991aa4e38a9dc36f27e2d24'
        type: string

# 3) حداقل مجوزها — تنها خواندن. دلیل هر مجوز نوشتن باید مستند شود؛ این workflow هیچ نوشتن ندارد.
permissions:
  contents: read   # checkout + خواندن configs/benchmarks/star_embed_ztf_40k.json
  actions: read    # download-artifact از run قبلی (فقط JSONهای کوچک)
# بدون contents:write — از پوش خودکار گزارش به مخزن خودداری شد (دلیل: جلوگیری از آلودگی تاریخچه و حفظ اصل کمترین مجوز)
# بدون pull-requests:write / issues:write — از ارسال PR comment غیرضروری خودداری شد (دلیل: شواهد فقط از طریق artifact و step summary قابل بازیابی است)

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: 0) Initial state — commits & PR (exit 0 expected)
        run: |
          set -euo pipefail
          echo "origin/main: $(git rev-parse origin/main 2>/dev/null | cut -c1-7 || echo unknown)"
          echo "HEAD: $(git rev-parse HEAD | cut -c1-7)"
          git log --oneline -5
          echo "--- PR #212 ---"
          gh pr view 212 --json number,state,isDraft,headRefName,headRefOid,baseRefName 2>&1 | jq . || true
          echo "--- prior heavy failure 39577115285 ---"
          gh api repos/saeed92m/ztf-classifier/actions/runs/39577115285 --jq '{id: .id, head_branch: .head_branch, head_sha: .head_sha[0:7], conclusion: .conclusion, name: .name}' 2>&1 | jq . || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 1) Attempt small artifact extraction (no 432 MB transfer)
        uses: actions/download-artifact@v7
        with:
          name: star-embed-independent-validation
          path: /tmp/star-embed-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.target_run_id }}
          repository: saeed92m/ztf-classifier
        continue-on-error: true

      - name: Record exit code of artifact download
        if: always()
        run: |
          set -euo pipefail
          echo "Artifact download step finished (continue-on-error=true, exit code not failing job). Check 1b for contents."

      - name: 1b) List artifact contents & small JSONs (low-volume)
        run: |
          set -euo pipefail
          echo "=== Artifact path ==="
          ls -R /tmp/star-embed-artifact 2>&1 | head -n 120 || echo "no artifact downloaded"
          du -sh /tmp/star-embed-artifact 2>&1 | head -n 5 || true
          echo "=== Small JSONs only ==="
          find /tmp/star-embed-artifact -type f -name "*.json" -exec ls -lh {} \; 2>&1 | head -n 40 || true
          for f in $(find /tmp/star-embed-artifact -type f \( -name "independent_dataset_report.json" -o -name "data.acquisition.json" \) 2>/dev/null | head -5); do
            echo "--- $f ($(wc -c < "$f") bytes) ---"
            cat "$f" 2>&1 | head -n 300 || true
            echo "SHA256: $(sha256sum "$f" 2>&1 | cut -d' ' -f1 || echo n/a)"
          done

      - name: Setup Python (locked)
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip==26.2 setuptools==84.0.0 wheel==0.48.0
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install huggingface_hub pyarrow pandas --quiet
          python -c "import pyarrow, pandas, huggingface_hub; print(pyarrow.__version__, pandas.__version__, huggingface_hub.__version__)"

      - name: 2) Resolve dataset revision (pinned, no download)
        run: |
          set -euo pipefail
          echo "=== Config provenance ==="
          cat configs/benchmarks/star_embed_ztf_40k.json | python -m json.tool
          python <<'PY'
          import json
          cfg = json.load(open("configs/benchmarks/star_embed_ztf_40k.json"))
          print(f"config revision field: {cfg['input_contract']['revision']}")
          print(f"config version: {cfg.get('version')}")
          print(f"config source: {cfg.get('source')}")
          print(f"object_id_column: {cfg.get('object_id_column')}")
          PY
          EFFECTIVE_REVISION="${{ inputs.dataset_revision }}"
          CONFIG_REV=$(python -c "import json; print(json.load(open('configs/benchmarks/star_embed_ztf_40k.json'))['input_contract']['revision'])")
          echo "Input revision (workflow_dispatch): '$EFFECTIVE_REVISION'"
          echo "Config revision: '$CONFIG_REV'"
          if [ -z "$EFFECTIVE_REVISION" ]; then
            EFFECTIVE_REVISION="33046797fb619f93a991aa4e38a9dc36f27e2d24"
            echo "Input empty (push trigger) -> fixed to pinned failing-shard revision: $EFFECTIVE_REVISION"
          fi
          # اگر config resolve_at_acquisition بود، در این workflow ثابت پین‌شده را ترجیح می‌دهیم
          # چون هدف 5) فقط shard شکست‌خورده روی revision ثابت است
          if [ "$CONFIG_REV" != "resolve_at_acquisition" ] && [ "$CONFIG_REV" != "" ] && [ "$EFFECTIVE_REVISION" = "33046797fb619f93a991aa4e38a9dc36f27e2d24" ]; then
            # pin را حفظ کن
            echo "Keeping pinned revision: $EFFECTIVE_REVISION (config is resolve_at_acquisition, documented for reproducibility)"
          fi
          # Validate 40-char SHA format
          if ! echo "$EFFECTIVE_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: revision must be 40-char hex SHA, got: $EFFECTIVE_REVISION" >&2
            exit 1
          fi
          echo "EFFECTIVE_REVISION=$EFFECTIVE_REVISION" >> $GITHUB_ENV
          echo "$EFFECTIVE_REVISION" > /tmp/effective_revision.txt
          cat /tmp/effective_revision.txt
          echo "--- HF URL for failing shard only ---"
          python <<PY2
          from huggingface_hub import hf_hub_url
          rev = open("/tmp/effective_revision.txt").read().strip()
          print(hf_hub_url(repo_id="StarEmbed/ZTF_40k", filename="data/train-00001-of-00002.parquet", revision=rev))
          PY2

      - name: 2b) Fixture tests — counting logic without secret (must pass before real data)
        run: |
          set -euo pipefail
          echo "=== 4) آزمون‌های بدون secret — fixtureهای مصنوعی ==="
          python <<'PY'
          import pathlib, tempfile, json, hashlib
          import pyarrow as pa, pyarrow.parquet as pq, pandas as pd

          def diagnose_counts(df):
              """Same logic as validator: returns dict with required fields, raises on missing sourceid column."""
              if "sourceid" not in df.columns:
                  raise ValueError("missing sourceid column")
              total = len(df)
              null_n = int(df["sourceid"].isna().sum())
              dup_keep_false = int(df["sourceid"].duplicated(keep=False).sum())
              dup_keep_first = int(df["sourceid"].duplicated().sum())
              vc = df["sourceid"].value_counts(dropna=False)
              dups = vc[vc > 1]
              distinct_dup = int(len(dups))
              # overlap helper
              return {
                  "rows": total,
                  "null_sourceid": null_n,
                  "duplicated_rows_all_members": dup_keep_false,
                  "duplicated_rows_keep_first": dup_keep_first,
                  "distinct_duplicated_ids": distinct_dup,
                  "top_duplicate_frequencies": {str(k): int(v) for k,v in dups.head(10).items()},
              }

          def write_parquet(path, data):
              # data: dict column -> list
              table = pa.table(data)
              pq.write_table(table, path)

          tmp = pathlib.Path(tempfile.mkdtemp())
          ok = True

          # Fixture A: شناسه تهی
          df_a = pd.DataFrame({"sourceid": [1, None, 3], "class_str": ["EW","EA","RRab"]})
          p_a = tmp / "a.parquet"
          write_parquet(p_a, {"sourceid": [1, None, 3], "class_str": ["EW","EA","RRab"]})
          r_a = diagnose_counts(df_a)
          assert r_a["rows"] == 3, r_a
          assert r_a["null_sourceid"] == 1, r_a
          assert r_a["distinct_duplicated_ids"] == 0, r_a
          print(f"Fixture A (null) PASS: {r_a}")

          # Fixture B: یکتا
          df_b = pd.DataFrame({"sourceid": [10,11,12]})
          r_b = diagnose_counts(df_b)
          assert r_b["rows"] == 3 and r_b["null_sourceid"] == 0 and r_b["distinct_duplicated_ids"] == 0
          print(f"Fixture B (unique) PASS: {r_b}")

          # Fixture C: تکراری
          df_c = pd.DataFrame({"sourceid": [1,1,2,2,2,3]})
          r_c = diagnose_counts(df_c)
          assert r_c["rows"] == 6, r_c
          assert r_c["duplicated_rows_all_members"] == 5, r_c  # 1 appears 2x, 2 appears 3x => 5 rows part of duplicate
          assert r_c["duplicated_rows_keep_first"] == 3, r_c  # second 1 + two extra 2s
          assert r_c["distinct_duplicated_ids"] == 2, r_c
          assert r_c["top_duplicate_frequencies"]["2"] == 3
          print(f"Fixture C (duplicate) PASS: {r_c}")

          # Fixture D: overlap بین دو split
          df_d1 = pd.DataFrame({"sourceid": [1,2,3]})
          df_d2 = pd.DataFrame({"sourceid": [3,4,5]})
          all_ids = {}
          for name, df in [("train-00001", df_d1), ("validation", df_d2)]:
              for sid in df["sourceid"].dropna().unique():
                  all_ids.setdefault(str(sid), []).append(name)
          overlap = {k:v for k,v in all_ids.items() if len(v)>1}
          assert len(overlap) == 1 and "3" in overlap, overlap
          print(f"Fixture D (overlap) PASS: {overlap}")

          # Fixture E: گزارش شکست — ستون sourceid مفقود باید ValueError بدهد و exit غیرصفر
          try:
              diagnose_counts(pd.DataFrame({"oid": [1,2]}))
              print("Fixture E FAIL: expected ValueError for missing sourceid")
              ok = False
          except ValueError as e:
              print(f"Fixture E (missing column correctly fails) PASS: {e}")

          # Validate JSON schema of report
          sample_report = {
              "generated_utc": "2026-10-23T00:00:00Z",
              "effective_revision": "33046797fb619f93a991aa4e38a9dc36f27e2d24",
              "manifest": {},
              "shards": {"train-00001-of-00002.parquet": r_c},
              "cross_shard_overlap": {"num_sourceids_in_multiple_shards": 1},
          }
          required_top = ["generated_utc","effective_revision","manifest","shards"]
          for k in required_top:
              assert k in sample_report, f"missing required field {k}"
          json.dumps(sample_report)  # must be serializable
          print("JSON schema validation PASS")

          if not ok:
              raise SystemExit(1)
          print("All fixture tests PASSED")
          PY

      - name: 3) Download ONLY failing shard on pinned revision (HF_TOKEN scoped here)
        run: |
          set -euo pipefail
          REVISION=$(cat /tmp/effective_revision.txt)
          echo "Effective revision: $REVISION"
          echo "Time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 1) احراز هویت Hugging Face — فقط وضعیت configured/missing، بدون چاپ توکن یا طول آن
          if [ -n "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN status: configured"
          else
            echo "HF_TOKEN status: missing — gated dataset will 401; real counts will be BLOCKED_GATED_DATASET"
          fi
          mkdir -p /tmp/star-embed-shards
          python <<'PY'
          import os, pathlib, hashlib, json, time
          from huggingface_hub import hf_hub_download, hf_hub_url
          rev = open("/tmp/effective_revision.txt").read().strip()
          repo = "StarEmbed/ZTF_40k"
          # 5) پس از تأیید امنیت — فقط shard شکست‌خورده روی revision ثابت
          files = ["data/train-00001-of-00002.parquet"]
          out = {}
          for fname in files:
              url = hf_hub_url(repo_id=repo, filename=fname, revision=rev)
              print(f"URL: {url}")
              print(f"Revision: {rev}")
              print(f"Time UTC: {time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}")
              # HF_TOKEN is read from env automatically by huggingface_hub; never print it
              token_status = "configured" if os.environ.get("HF_TOKEN") else "missing"
              print(f"HF_TOKEN status: {token_status}")
              try:
                  path = hf_hub_download(repo_id=repo, filename=fname, revision=rev)
                  size = pathlib.Path(path).st_size
                  sha = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
                  print(f"OK {fname}: size={size} sha256={sha}")
                  out[fname] = {"url": url, "revision": rev, "size": size, "sha256": sha, "time_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  import shutil
                  dest = pathlib.Path("/tmp/star-embed-shards") / pathlib.Path(fname).name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy(path, dest)
                  print(f"  -> copied to {dest}")
              except Exception as e:
                  print(f"SKIP {fname}: {e}")
                  out[fname] = {"url": url, "revision": rev, "error": str(e), "time_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          json.dump(out, open("/tmp/download_manifest.json","w"), indent=2, ensure_ascii=False)
          print(open("/tmp/download_manifest.json").read())
          PY
          cat /tmp/download_manifest.json
          ls -lh /tmp/star-embed-shards/ || true
          sha256sum /tmp/star-embed-shards/* 2>&1 | head -20 || true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: 4) Compute counts — rows, nulls, duplicates, distinct, frequencies, samples, row indices, overlap (strict, no false success)
        run: |
          set -euo pipefail
          python <<'PY'
          import pathlib, json, hashlib, os, time
          import pyarrow.parquet as pq
          import pandas as pd

          shard_dir = pathlib.Path("/tmp/star-embed-shards")
          shards = sorted(shard_dir.glob("*.parquet"))
          manifest = json.load(open("/tmp/download_manifest.json")) if pathlib.Path("/tmp/download_manifest.json").exists() else {}
          effective_rev = open("/tmp/effective_revision.txt").read().strip() if pathlib.Path("/tmp/effective_revision.txt").exists() else None

          # اگر gated و بدون HF_TOKEN — گزارش BLOCKED را بساز و با موفقیت خارج شو (دسترسی مسدود، نه باگ شمارش)
          if not shards:
              import glob as g
              shards = [pathlib.Path(p) for p in g.glob(os.path.expanduser("~/.cache/huggingface/**/train-00001-of-00002.parquet"), recursive=True)]
          if not shards:
              print("No shards downloaded — HF_TOKEN missing or gated repo inaccessible. Recording BLOCKED_GATED_DATASET.")
              report = {
                  "generated_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "effective_revision": effective_rev,
                  "manifest": manifest,
                  "shards": {},
                  "cross_shard_overlap": {"num_sourceids_in_multiple_shards": 0, "examples": {}},
                  "status": "BLOCKED_GATED_DATASET",
                  "note": "HF_TOKEN missing or insufficient — cannot read failing shard on pinned revision; counts unavailable until token configured"
              }
              # اعتبارسنجی JSON و فیلدهای اجباری
              for k in ["generated_utc", "effective_revision", "manifest", "shards", "status"]:
                  assert k in report, f"missing required field {k}"
              out = pathlib.Path("/tmp/star-embed-diagnosis-report.json")
              json.dump(report, open(out, "w"), indent=2, ensure_ascii=False)
              assert json.load(open(out)), "written JSON is invalid"
              print(f"Wrote {out} ({out.stat().st_size} bytes)")
              print(open(out).read()[:4000])
              raise SystemExit(0)

          # حالت عادی — شمارش واقعی
          print(f"Found shards: {[str(s) for s in shards]}")
          report = {
              "generated_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "effective_revision": effective_rev,
              "manifest": manifest,
              "shards": {}
          }
          all_sourceids = {}

          for shard_path in shards:
              print(f"\n{'='*80}\nAnalyzing: {shard_path} (size={shard_path.stat().st_size} sha256={hashlib.sha256(shard_path.read_bytes()).hexdigest()})")
              table = pq.read_table(shard_path)
              cols = table.column_names
              print(f"  columns: {cols}")
              print(f"  rows: {table.num_rows}")
              df = table.to_pandas()
              if "sourceid" not in df.columns:
                  raise ValueError(f"missing sourceid column in {shard_path.name} — columns were {cols}")
              total = len(df)
              null_n = int(df["sourceid"].isna().sum())
              dup_all = int(df["sourceid"].duplicated(keep=False).sum())
              dup_first = int(df["sourceid"].duplicated().sum())
              vc = df["sourceid"].value_counts(dropna=False)
              dups = vc[vc > 1]
              distinct_dup = int(len(dups))
              print(f"  total rows: {total}")
              print(f"  null sourceid: {null_n}")
              print(f"  duplicated_rows_all_members: {dup_all}")
              print(f"  duplicated_rows_keep_first: {dup_first}")
              print(f"  distinct_duplicated_ids: {distinct_dup}")
              if distinct_dup:
                  print("  top duplicate frequencies:")
                  print(dups.head(10).to_string())
                  freq_of_freq = dups.value_counts().sort_index()
                  print("  frequency-of-frequencies:")
                  print(freq_of_freq.head(20).to_string())
                  print("  samples — up to 3 duplicated IDs with row indices:")
                  for sid in dups.head(3).index:
                      if pd.isna(sid):
                          continue
                      idx = df.index[df["sourceid"] == sid].tolist()
                      print(f"    sourceid={sid!r} count={int(vc[sid])} row_indices={idx[:10]}")
              for sid in df["sourceid"].dropna().unique():
                  all_sourceids.setdefault(str(sid), []).append(shard_path.name)
              report["shards"][shard_path.name] = {
                  "file": str(shard_path),
                  "size": int(shard_path.stat().st_size),
                  "sha256": hashlib.sha256(shard_path.read_bytes()).hexdigest(),
                  "rows": int(total),
                  "null_sourceid": int(null_n),
                  "duplicated_rows_all_members": int(dup_all),
                  "duplicated_rows_keep_first": int(dup_first),
                  "distinct_duplicated_ids": int(distinct_dup),
                  "top_duplicate_frequencies": {str(k): int(v) for k,v in dups.head(10).items()} if distinct_dup else {},
                  "frequency_of_frequencies": {str(k): int(v) for k,v in (dups.value_counts().sort_index().head(10).items())} if distinct_dup else {},
              }

          overlapping = {sid: shs for sid, shs in all_sourceids.items() if len(shs) > 1}
          print(f"\nCross-shard overlap: {len(overlapping)} sourceids in >1 shard")
          report["cross_shard_overlap"] = {"num_sourceids_in_multiple_shards": len(overlapping), "examples": {k: v for k,v in list(overlapping.items())[:5]}}

          # اعتبارسنجی ساختار JSON و فیلدهای اجباری — در صورت نقص، خطا و exit غیرصفر
          for k in ["generated_utc", "effective_revision", "manifest", "shards"]:
              if k not in report:
                  raise AssertionError(f"missing required field {k}")
          out_path = pathlib.Path("/tmp/star-embed-diagnosis-report.json")
          json.dump(report, open(out_path, "w"), indent=2, ensure_ascii=False)
          # اعتبارسنجی JSON نوشته‌شده
          loaded = json.load(open(out_path))
          assert loaded == report, "round-trip JSON mismatch"
          print(f"\nWrote {out_path} ({out_path.stat().st_size} bytes)")
          print(open(out_path).read()[:8000])
          PY

      - name: Validate JSON report structure (separate check, non-zero on invalid)
        run: |
          set -euo pipefail
          echo "Validating /tmp/star-embed-diagnosis-report.json ..."
          test -f /tmp/star-embed-diagnosis-report.json || { echo "ERROR: report not found"; exit 1; }
          python <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/star-embed-diagnosis-report.json")
          data = json.load(open(p))
          required = ["generated_utc", "effective_revision", "manifest", "shards"]
          for k in required:
              assert k in data, f"missing required field: {k}"
          # shards entries must have rows/null/duplicated fields if present
          for name, shard in data.get("shards", {}).items():
              if "error" not in shard:
                  for fk in ["rows", "null_sourceid", "sha256"]:
                      assert fk in shard, f"shard {name} missing {fk}"
          print("JSON valid, all required fields present")
          print(f"effective_revision: {data['effective_revision']}")
          print(f"status: {data.get('status','OK')}")
          PY
          echo "JSON validation exit code: $?"

      - name: 5) Documented grain — paper/README (no secret)
        run: |
          set -euo pipefail
          echo "=== configs/benchmarks/star_embed_ztf_40k.json ==="
          cat configs/benchmarks/star_embed_ztf_40k.json | python -m json.tool
          echo ""
          echo "=== HF README (dataset card) ==="
          curl -fsSL https://huggingface.co/datasets/StarEmbed/ZTF_40k/raw/main/README.md 2>&1 | head -n 200 || echo "README fetch failed (expected if gated)"
          echo ""
          echo "DOI: 10.48550/arXiv.2510.06200 — grain must be verified: row = object or observation?"

      - name: Upload small diagnosis evidence only (no raw parquet)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: star-embed-diagnosis-report
          path: |
            /tmp/star-embed-diagnosis-report.json
            /tmp/download_manifest.json
            /tmp/effective_revision.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Report data access status (never print token)
        if: always()
        run: |
          set -euo pipefail
          echo "=== Data access status ==="
          if [ -f /tmp/download_manifest.json ]; then
            python -c "import json; m=json.load(open('/tmp/download_manifest.json')); print('manifest entries:', len(m)); [print(k, 'error' if 'error' in v else 'OK', v.get('sha256','')[0:8]) for k,v in m.items()]"
          else
            echo "No manifest — download step did not run"
          fi
          if [ -f /tmp/star-embed-diagnosis-report.json ]; then
            python -c "import json; d=json.load(open('/tmp/star-embed-diagnosis-report.json')); print('report status:', d.get('status','OK')); print('revision:', d.get('effective_revision'))"
          fi

