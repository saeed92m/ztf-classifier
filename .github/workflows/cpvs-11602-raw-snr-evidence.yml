name: CPVS 11,602 Raw SNR Evidence Scan

on:
  push:
    branches:
      - research/cpvs-snr-formula-audit-20261112
    paths:
      - ".github/workflows/cpvs-11602-raw-snr-evidence.yml"
      - "scripts/diagnose_cpvs_membership_snr_sample.py"
      - "tests/test_cpvs_membership_snr_sample.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpvs-11602-raw-snr-evidence
  cancel-in-progress: false

jobs:
  raw-snr-evidence:
    name: Scan pinned g/r archives for the 11,602 residual IDs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out investigation revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Preflight — standard runner and free disk boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          uname -a
          python --version
          command -v curl
          command -v gh
          command -v unzip
          df -h .
          available_bytes="$(df -B1 --output=avail . | tail -n 1 | tr -d ' ')"
          minimum_bytes=4000000000
          if [ "$available_bytes" -lt "$minimum_bytes" ]; then
            echo "Insufficient free disk: $available_bytes bytes; need at least $minimum_bytes."
            exit 1
          fi
          mkdir -p work/refs work/archives reports
          python - <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          record = {
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_ref": os.environ.get("GITHUB_REF"),
              "github_event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "platform": platform.platform(),
              "python": sys.version,
              "execution_policy": "standard GitHub-hosted ubuntu-latest only; no larger or self-hosted runner",
              "raw_archive_policy": "download compressed archives to runner only; do not upload raw archives",
          }
          Path("reports/runner_manifest.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Run synthetic regression tests
        run: python -m pytest -q tests/test_cpvs_membership_snr_sample.py

      - name: Retrieve immutable CPVS object and sample inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41367972395 --repo saeed92m/ztf-classifier \
            --name cpvs-raw-cds-reconciliation --dir work/refs
          for file in \
            output/candidate_only_11602_object_provenance.tsv \
            output/fixed_sample_100.tsv \
            output/fixed_sample_1000.tsv \
            output/four_field_only_55.tsv; do
            test -s "work/refs/$file"
          done
          echo "Reference inputs retrieved. Their exact size and SHA-256 values are verified by the diagnostic before raw scanning."

      - name: Download checksum-pinned Zenodo g/r archives
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
            "https://zenodo.org/records/3886372/files/ztf2g.zip?download=1" \
            --output work/archives/ztf2g.zip &
          g_pid=$!
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
            "https://zenodo.org/records/3886372/files/ztf2r.zip?download=1" \
            --output work/archives/ztf2r.zip &
          r_pid=$!
          g_status=0
          r_status=0
          wait "$g_pid" || g_status=$?
          wait "$r_pid" || r_status=$?
          if [ "$g_status" -ne 0 ] || [ "$r_status" -ne 0 ]; then
            echo "g download exit=$g_status"
            echo "r download exit=$r_status"
            exit 1
          fi

          g_bytes="$(stat -c %s work/archives/ztf2g.zip)"
          r_bytes="$(stat -c %s work/archives/ztf2r.zip)"
          printf "ztf2g.zip\t%s bytes\nztf2r.zip\t%s bytes\n" "$g_bytes" "$r_bytes" \
            | tee reports/source_archive_sizes.tsv
          if [ "$g_bytes" -gt 1000000000 ] || [ "$r_bytes" -gt 1000000000 ]; then
            echo "Unexpected archive size. Refuse to continue."
            exit 1
          fi

          echo "850fcef561dd7407fbe8e19e99100d7a  work/archives/ztf2g.zip" | md5sum --check -
          echo "daa7bc45c67579253eebe6b1c09dfbd9  work/archives/ztf2r.zip" | md5sum --check -
          echo "47cd1823b3ccdb69fa3085381cf63ff0605f6d841fc3bc37489dce023ddc19b9  work/archives/ztf2g.zip" | sha256sum --check -
          echo "48331ba1157afc993a1399e094b97752a82d8d0f736d2fdf63fd7b2a82281b74  work/archives/ztf2r.zip" | sha256sum --check -
          sha256sum work/archives/ztf2g.zip work/archives/ztf2r.zip \
            | tee reports/source_archive_sha256.txt
          df -h .

      - name: Re-derive raw g/r SNR for all residual IDs and fixed controls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diagnose_cpvs_membership_snr_sample.py \
            --g-archive work/archives/ztf2g.zip \
            --r-archive work/archives/ztf2r.zip \
            --candidate-only work/refs/output/candidate_only_11602_object_provenance.tsv \
            --sample-100 work/refs/output/fixed_sample_100.tsv \
            --sample-1000 work/refs/output/fixed_sample_1000.tsv \
            --four-field-only work/refs/output/four_field_only_55.tsv \
            --output reports/cpvs_membership_raw_snr_rederivation.json \
            --objects-output reports/cpvs_membership_raw_snr_objects.tsv
          test -s reports/cpvs_membership_raw_snr_rederivation.json
          test -s reports/cpvs_membership_raw_snr_objects.tsv

      - name: Upload compact audit evidence only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-11602-raw-snr-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 14
