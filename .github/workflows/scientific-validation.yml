name: Scientific Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "ci/heavy/**"
    tags:
      - "v*.*.*"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run_heavy:
        description: "Run full source-backed benchmark acquisition and derivation"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  registry-contract:
    name: Validate benchmark and cumulative lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Validate registry manifests
        run: python -m ztf_classifier.validation list

      - name: Run scientific validation contract tests
        run: python -m pytest -q tests/test_scientific_validation_registry.py

      - name: Run cumulative lifecycle contract tests
        run: python -m pytest -q tests/test_cumulative_lifecycle.py

  heavy-scientific-validation:
    name: Execute source-backed benchmark acquisition and derivation
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_heavy == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/heavy/'))) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci/heavy/'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Acquire 781k CPVS parent evidence
        id: acquire_parent
        run: |
          mkdir -p reports/scientific_validation/ztf_periodic_781k
          if ! python -m ztf_classifier.validation acquire \
            --benchmark-id ztf_periodic_781k \
            --output reports/scientific_validation/ztf_periodic_781k/Table2.txt.zip \
            --code-version "${GITHUB_SHA}"; then
            report=reports/scientific_validation/ztf_periodic_781k/Table2.txt.zip.acquisition.json
            if [ -s "$report" ]; then
              echo "CPVS parent acquisition report:" >&2
              cat "$report" >&2
            else
              echo "CPVS parent acquisition failed without an acquisition report." >&2
            fi
            exit 1
          fi

      - name: Restore immutable CPVS light-curve archive cache
        id: cpvs_archive_cache
        uses: actions/cache@v4
        with:
          path: |
            reports/scientific_validation/ztf_periodic_730k/ztf2g.zip
            reports/scientific_validation/ztf_periodic_730k/ztf2r.zip
          key: cpvs-lightcurves-zenodo-3886372-850fcef561dd7407fbe8e19e99100d7a-daa7bc45c67579253eebe6b1c09dfbd9

      - name: Download independent published 730k membership
        id: download_published_membership
        if: always()
        run: |
          set -euo pipefail
          root=reports/scientific_validation/ztf_periodic_730k
          mkdir -p "$root"
          curl --location --fail --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 180 \
            "https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=J/ApJ/932/118/table4&-out=ZTF,ID&-out.max=1000000" \
            -o "$root/published_table4.dat"
          test -s "$root/published_table4.dat"
          echo "Published VizieR membership downloaded."

      - name: Download and normalize CPVS light-curve inputs for 730k derivation
        id: download_lightcurves
        run: |
          set -euo pipefail

          root=reports/scientific_validation/ztf_periodic_730k
          mkdir -p "$root/g" "$root/r"

          # Reuse the immutable, checksum-pinned Zenodo archives across runs.
          # On a cache miss, download both archives concurrently with retries.
          if [ ! -s "$root/ztf2g.zip" ] || [ ! -s "$root/ztf2r.zip" ]; then
            rm -f "$root/ztf2g.zip" "$root/ztf2r.zip"
            curl --location --fail --show-error --silent \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
              "https://zenodo.org/records/3886372/files/ztf2g.zip?download=1" \
              -o "$root/ztf2g.zip" >"$root/ztf2g.download.log" 2>&1 &
            g_pid=$!
            curl --location --fail --show-error --silent \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
              "https://zenodo.org/records/3886372/files/ztf2r.zip?download=1" \
              -o "$root/ztf2r.zip" >"$root/ztf2r.download.log" 2>&1 &
            r_pid=$!

            g_status=0
            r_status=0
            wait "$g_pid" || g_status=$?
            wait "$r_pid" || r_status=$?
            if [ "$g_status" -ne 0 ] || [ "$r_status" -ne 0 ]; then
              echo "g download exit=$g_status" >&2
              cat "$root/ztf2g.download.log" >&2 || true
              echo "r download exit=$r_status" >&2
              cat "$root/ztf2r.download.log" >&2 || true
              exit 1
            fi
          else
            echo "Restored both CPVS archives from cache."
          fi

          echo "850fcef561dd7407fbe8e19e99100d7a  $root/ztf2g.zip" | md5sum -c -
          echo "daa7bc45c67579253eebe6b1c09dfbd9  $root/ztf2r.zip" | md5sum -c -

          unzip -q "$root/ztf2g.zip" -d "$root/g"
          unzip -q "$root/ztf2r.zip" -d "$root/r"

          # The Zenodo downloads are outer archives and may contain nested
          # archive containers. Normalize them to actual text data files.
          for band in g r; do
            while find "$root/$band" -type f -iname '*.zip' -print -quit | grep -q .; do
              while IFS= read -r -d '' nested; do
                target="${nested%.zip}"
                mkdir -p "$target"
                unzip -q "$nested" -d "$target"
                rm -f "$nested"
              done < <(find "$root/$band" -type f -iname '*.zip' -print0)
            done
          done

          printf 'g files: '
          find "$root/g" -type f | wc -l
          printf 'r files: '
          find "$root/r" -type f | wc -l

      - name: Validate parent evidence integrity
        run: |
          set -euo pipefail
          parent="reports/scientific_validation/ztf_periodic_781k/Table2.txt.zip"
          evidence="$parent.evidence.json"
          expected_count=781602

          test -f "$parent" || {
            echo "ERROR: Parent file not found: $parent" >&2
            exit 1
          }

          test -f "$evidence" || {
            echo "ERROR: Parent evidence file not found: $evidence" >&2
            exit 1
          }

          row_count="$(
            python - "$evidence" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              evidence = json.load(f)

          if isinstance(evidence, list):
              count = len(evidence)
          elif isinstance(evidence, dict):
              value = evidence.get("row_count")
              if isinstance(value, bool) or not isinstance(value, int):
                  keys = ", ".join(sorted(evidence))
                  raise SystemExit(
                      "ERROR: Evidence must contain integer row_count; "
                      f"available keys: {keys}"
                  )
              count = value
          else:
              raise SystemExit(
                  "ERROR: Evidence must be a JSON list or object containing row_count"
              )

          print(count)
          PY
          )"

          if [ "$row_count" -ne "$expected_count" ]; then
            echo "ERROR: Parent evidence row count mismatch: expected $expected_count, got $row_count" >&2
            exit 1
          fi

          echo "Parent evidence validated: $row_count rows"
          echo "Parent SHA256: $(sha256sum "$parent" | awk '{print $1}')"
          echo "Evidence SHA256: $(sha256sum "$evidence" | awk '{print $1}')"

      - name: Derive published 730k subset
        id: derive_730k
        continue-on-error: true
        run: |
          set -euo pipefail
          parent="reports/scientific_validation/ztf_periodic_781k/Table2.txt.zip"
          evidence="$parent.evidence.json"

          test -f "$parent" || {
            echo "ERROR: Parent evidence unavailable: $parent" >&2
            exit 1
          }

          test -f "$evidence" || {
            echo "ERROR: Parent evidence metadata unavailable: $evidence" >&2
            exit 1
          }

          parent_sha="$(sha256sum "$evidence" | awk '{print $1}')"
          python -m ztf_classifier.validation derive-730k             --parent "$parent"             --g-lightcurve reports/scientific_validation/ztf_periodic_730k/g             --r-lightcurve reports/scientific_validation/ztf_periodic_730k/r             --output reports/scientific_validation/ztf_periodic_730k/selected.tsv             --parent-evidence-sha256 "$parent_sha"             --code-version "${GITHUB_SHA}"


      - name: Diagnose CPVS selection semantics
        if: >-
          always() &&
          steps.acquire_parent.outcome == 'success' &&
          steps.download_lightcurves.outcome == 'success' &&
          steps.download_published_membership.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/diagnose_cpvs_selection.py \
            --parent reports/scientific_validation/ztf_periodic_781k/Table2.txt.zip \
            --g reports/scientific_validation/ztf_periodic_730k/g \
            --r reports/scientific_validation/ztf_periodic_730k/r \
            --published reports/scientific_validation/ztf_periodic_730k/published_table4.dat \
            --output reports/scientific_validation/ztf_periodic_730k/selection_diagnostics.json

      - name: Audit 730k membership against independent publication
        id: audit_730k
        if: always() && steps.derive_730k.outcome == 'success' && steps.download_published_membership.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/audit_cpvs_membership.py \
            --candidate reports/scientific_validation/ztf_periodic_730k/selected.tsv \
            --published reports/scientific_validation/ztf_periodic_730k/published_table4.dat \
            --output reports/scientific_validation/ztf_periodic_730k/membership_audit.json

      - name: Classify CPVS reconstruction result
        if: always()
        env:
          ACQUIRE_PARENT_OUTCOME: ${{ steps.acquire_parent.outcome }}
          DERIVE_OUTCOME: ${{ steps.derive_730k.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit_730k.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("reports/scientific_validation/ztf_periodic_730k")
          derive_outcome = os.environ.get("DERIVE_OUTCOME", "unknown")
          audit_outcome = os.environ.get("AUDIT_OUTCOME", "unknown")
          diagnostic = root / "selected.tsv.diagnostic.json"
          audit = root / "membership_audit.json"

          # Exact reproduction is opt-in: every required evidence condition must pass.
          # Missing/failed audit evidence must never default to PASS.
          status = "UNRESOLVED"
          reason = "CPVS exact membership is not established; required evidence is incomplete"

          if derive_outcome != "success":
              if diagnostic.is_file():
                  reason = "published 730,184-object membership was not reproduced; candidate/diagnostic evidence retained"
              elif os.environ.get("ACQUIRE_PARENT_OUTCOME") != "success":
                  reason = "CPVS parent acquisition failed or was blocked; exact membership cannot be evaluated"
              else:
                  reason = "CPVS derivation did not complete and diagnostic evidence is unavailable"
          elif audit_outcome != "success":
              reason = "independent VizieR membership audit did not complete successfully"
          elif not audit.is_file():
              reason = "independent VizieR membership audit output is missing"
          else:
              payload = json.loads(audit.read_text(encoding="utf-8"))
              if payload.get("exact_membership_match") is True:
                  status = "PASS"
                  reason = "exact published CPVS membership reproduced"
              else:
                  reason = "derived candidate does not exactly match independent VizieR membership"

          result = {
              "status": status,
              "release_claim": "external_cpvs_exact_reproduction",
              "product_gate_effect": "none",
              "derive_outcome": derive_outcome,
              "audit_outcome": audit_outcome,
              "reason": reason,
              "published_membership_source": "VizieR J/ApJ/932/118 table4.dat",
          }
          (root / "cpvs_reconstruction_status.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Acquire StarEmbed source package
        run: |
          mkdir -p reports/scientific_validation/ztf_star_embed
          python -m ztf_classifier.validation acquire             --benchmark-id star_embed_ztf_40k             --output reports/scientific_validation/ztf_star_embed             --code-version "${GITHUB_SHA}"

      - name: Validate heavy execution evidence contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "reports/scientific_validation/ztf_periodic_781k/Table2.txt.zip"
            "reports/scientific_validation/ztf_periodic_781k/Table2.txt.zip.evidence.json"
            "reports/scientific_validation/ztf_periodic_730k/ztf2g.zip"
            "reports/scientific_validation/ztf_periodic_730k/ztf2r.zip"
            "reports/scientific_validation/ztf_periodic_730k/selected.tsv"
            "reports/scientific_validation/ztf_periodic_730k/cpvs_reconstruction_status.json"
            "reports/scientific_validation/ztf_star_embed"
          )
          for path in "${required[@]}"; do
            if [ ! -e "$path" ]; then
              echo "Missing heavy execution evidence: $path" >&2
              exit 1
            fi
          done

          root="reports/scientific_validation/ztf_periodic_730k"
          if [ -f "$root/selected.tsv.evidence.json" ]; then
            echo "CPVS derivation produced immutable derived-benchmark evidence."
          elif [ -f "$root/selected.tsv.diagnostic.json" ]; then
            echo "CPVS exact reconstruction remains unresolved; diagnostic evidence is retained."
          else
            echo "Missing CPVS derivation evidence: expected immutable evidence or diagnostic evidence." >&2
            exit 1
          fi

          echo "Heavy source-backed execution evidence contract satisfied."
          echo "CPVS exact-membership reconstruction is external benchmark evidence, not the product execution path."
          echo "Product-level scientific release gate is evaluated separately and remains release-blocking."

      - name: Record release provenance
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p reports/scientific_validation/release
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "tag": os.environ["RELEASE_TAG"],
              "sha": os.environ["RELEASE_SHA"],
              "workflow": "Scientific Validation",
              "artifact_name": "scientific-validation-heavy",
          }
          Path("reports/scientific_validation/release/release_ref.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload heavy scientific evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scientific-validation-heavy
          path: reports/scientific_validation/**
          if-no-files-found: warn

  external-source-evidence:
    name: Execute DR24 and ALeRCE source-backed evidence
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_heavy == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/heavy/'))) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci/heavy/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Acquire DR24 and ALeRCE evidence
        run: |
          set -euo pipefail
          mkdir -p reports/scientific_validation/external_source_evidence
          python scripts/acquire_external_source_evidence.py --output-root reports/scientific_validation/external_source_evidence --code-version "${GITHUB_SHA}"

      - name: Validate external evidence contract
        run: |
          set -euo pipefail
          root=reports/scientific_validation/external_source_evidence
          test -s "$root/ztf_dr24_source_subset/response.tsv"
          test -s "$root/ztf_dr24_source_subset/response.tsv.evidence.json"
          test -s "$root/alerce_reference/response.tsv"
          test -s "$root/alerce_reference/response.tsv.evidence.json"
          echo "DR24 and ALeRCE source-backed evidence contracts satisfied."

      - name: Upload external source evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scientific-validation-external-source-evidence
          path: reports/scientific_validation/external_source_evidence/**
          if-no-files-found: warn


  frozen-historical-reference:
    name: Verify immutable historical ALeRCE and CPVS references
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_heavy == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/heavy/'))) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci/heavy/'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - alerce_reference_frozen_20200609
          - ztf_periodic_730k_published
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Acquire and verify immutable publisher snapshot
        run: |
          set -euo pipefail
          root="reports/scientific_validation/frozen_reference/${{ matrix.benchmark }}"
          mkdir -p "$root"
          python scripts/acquire_frozen_reference_evidence.py "${{ matrix.benchmark }}" --output "$root"

      - name: Validate evidence manifest
        run: |
          set -euo pipefail
          manifest="reports/scientific_validation/frozen_reference/${{ matrix.benchmark }}/evidence_manifest.json"
          test -s "$manifest"
          python - "$manifest" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          x=json.loads(p.read_text(encoding="utf-8"))
          for k in ("benchmark_id","source_url","archive","md5","sha256","member_count"):
              if not x.get(k):
                  raise SystemExit(f"missing evidence field: {k}")
          print(json.dumps({k:x[k] for k in ("benchmark_id","archive","md5","sha256","member_count")}, indent=2))
          PY

      - name: Remove large source archive before artifact upload
        if: always()
        run: |
          find reports/scientific_validation/frozen_reference -type f \
            ! -name 'evidence_manifest.json' -delete

      - name: Upload immutable-reference evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frozen-reference-evidence-${{ matrix.benchmark }}
          path: reports/scientific_validation/frozen_reference/${{ matrix.benchmark }}/evidence_manifest.json
          if-no-files-found: error

  scheduled-scientific-validation:
    name: Source provenance acquisition and scientific gate readiness
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci/heavy/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Probe source provenance endpoints
        run: python -m ztf_classifier.validation.source_probe reports/scientific_validation/source_probe.json

      - name: Validate provenance probe output
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/scientific_validation/source_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("reports/scientific_validation/source_probe.json").read_text())
          if not isinstance(payload, dict):
              raise SystemExit("source_probe.json must contain a JSON object")
          print("Source provenance probe output is structurally valid.")
          print("Product-level scientific release gate is intentionally evaluated separately.")
          PY

      - name: Upload provenance and gate evidence
        uses: actions/upload-artifact@v6
        with:
          name: scientific-validation-provenance
          path: reports/scientific_validation/source_probe.json
