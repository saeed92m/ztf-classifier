name: Scientific Validation

on:
  pull_request:
    paths:
      - "configs/benchmarks/**"
      - "configs/process/**"
      - "src/ztf_classifier/validation/**"
      - "src/ztf_classifier/lifecycle.py"
      - "src/ztf_classifier/lifecycle_schema.py"
      - "tests/test_scientific_validation_registry.py"
      - "tests/test_cumulative_lifecycle.py"
      - "docs/SCIENTIFIC_VALIDATION_BENCHMARK.md"
      - "docs/architecture/**"
      - "docs/roadmap/**"
      - "docs/knowledge/**"
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-contract:
    name: Validate benchmark and cumulative lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Validate registry manifests
        run: python -m ztf_classifier.validation list

      - name: Run scientific validation contract tests
        run: python -m pytest -q tests/test_scientific_validation_registry.py

      - name: Run cumulative lifecycle contract tests
        run: python -m pytest -q tests/test_cumulative_lifecycle.py

  scheduled-scientific-validation:
    name: Scheduled scientific validation readiness
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify external benchmark gate is explicit
        run: |
          grep -q "Scientific Validation" docs/PRODUCTION_ACCEPTANCE_CHECKLIST.md
          grep -q "NOT VERIFIED" docs/PRODUCTION_ACCEPTANCE_CHECKLIST.md
          grep -q "Cumulative Learning" docs/PRODUCTION_ACCEPTANCE_CHECKLIST.md
          echo "Heavy source-backed benchmark adapters remain scheduled/manual and release-blocking."
