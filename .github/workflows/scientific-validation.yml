name: Scientific Validation

on:
  pull_request:
    paths:
      - "configs/benchmarks/**"
      - "configs/process/**"
      - "src/ztf_classifier/validation/**"
      - "src/ztf_classifier/lifecycle.py"
      - "src/ztf_classifier/lifecycle_schema.py"
      - "tests/test_scientific_validation_registry.py"
      - "tests/test_cumulative_lifecycle.py"
      - "docs/SCIENTIFIC_VALIDATION_BENCHMARK.md"
      - "docs/architecture/**"
      - "docs/roadmap/**"
      - "docs/knowledge/**"
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-contract:
    name: Validate benchmark and cumulative lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Validate registry manifests
        run: python -m ztf_classifier.validation list

      - name: Run scientific validation contract tests
        run: python -m pytest -q tests/test_scientific_validation_registry.py

      - name: Run cumulative lifecycle contract tests
        run: python -m pytest -q tests/test_cumulative_lifecycle.py

  scheduled-scientific-validation:
    name: Source provenance acquisition and scientific gate readiness
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Probe source provenance endpoints
        run: python -m ztf_classifier.validation.source_probe reports/scientific_validation/source_probe.json

      - name: Preserve fail-closed scientific gate
        run: |
          python -m ztf_classifier.validation gate             --evidence-dir reports/scientific_validation             --output reports/scientific_validation/release_gate.json || test "$?" -eq 2

      - name: Upload provenance and gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: scientific-validation-provenance
          path: reports/scientific_validation/*.json
