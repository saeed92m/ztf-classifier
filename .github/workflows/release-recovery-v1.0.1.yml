name: Release Recovery v1.0.1

on:
  push:
    branches:
      - release/recover-v1.0.1

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0cd9bee55e5b991866dbcedc13aa7d8e33e0b70f
      - uses: actions/download-artifact@v8
        with:
          name: scientific-validation-heavy
          path: ${{ runner.temp }}/scientific-evidence
          run-id: 37637937968
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: scientific-validation-external-source-evidence
          path: ${{ runner.temp }}/scientific-external-evidence
          run-id: 37637937968
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-alerce_reference_frozen_20200609
          path: ${{ runner.temp }}/scientific-frozen-alerce
          run-id: 37637937968
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-ztf_periodic_730k_published
          path: ${{ runner.temp }}/scientific-frozen-cpvs
          run-id: 37637937968
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore evidence
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/scientific-evidence"
          root="$source"
          [ -d "$source/reports/scientific_validation" ] && root="$source/reports/scientific_validation"
          [ -d "$source/scientific_validation" ] && root="$source/scientific_validation"
          mkdir -p reports
          mv "$root" reports/scientific_validation
          mkdir -p reports/scientific_validation/external_source_evidence
          find "$RUNNER_TEMP/scientific-external-evidence" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/external_source_evidence {} +
          mkdir -p reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609
          find "$RUNNER_TEMP/scientific-frozen-alerce" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609 {} +
          mkdir -p reports/scientific_validation/frozen_reference/ztf_periodic_730k_published
          find "$RUNNER_TEMP/scientific-frozen-cpvs" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/ztf_periodic_730k_published {} +
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Build and validate
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install build
          python -m pip install -e .
          python -m pip check
          python -m ruff check src tests
          python -m pytest -q
          python -m build
          test "$(git rev-parse HEAD)" = "0cd9bee55e5b991866dbcedc13aa7d8e33e0b70f"
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "1.0.1"
          test -s ".github/release-notes/v1.0.1.md"
      - name: Create validated tag if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.1" >/dev/null 2>&1; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.1" --jq '.object.sha')" = "0cd9bee55e5b991866dbcedc13aa7d8e33e0b70f"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v1.0.1" -f sha="0cd9bee55e5b991866dbcedc13aa7d8e33e0b70f"
          fi
      - name: Publish v1.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.1" >/dev/null 2>&1; then
            echo "v1.0.1 release already exists; verifying."
          else
            gh release create v1.0.1 dist/*.whl dist/*.tar.gz --verify-tag --notes-file ".github/release-notes/v1.0.1.md"
          fi
      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.1")"
          test "$(jq -r .draft <<<"$j")" = false
          test "$(jq -r .prerelease <<<"$j")" = false
          test "$(jq '.assets | length' <<<"$j")" -ge 2
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.1" --jq '.object.sha')" = "0cd9bee55e5b991866dbcedc13aa7d8e33e0b70f"
          echo "v1.0.1 VERIFIED"
