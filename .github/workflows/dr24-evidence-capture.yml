name: DR24 Fixed-OID Evidence Capture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr24-evidence-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Prepare artifact directories
        run: mkdir -p artifacts/dr24-evidence/bundle
      - name: Install locked project and DR24 dependencies
        id: install
        shell: bash
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dr24.lock
          python -m pip install --no-deps -e .
      - name: Record dependency setup failure
        if: steps.install.outcome == 'failure'
        run: >-
          printf '%s\n' 'Pinned dependency installation failed; inspect the GitHub Actions job log.'
          > artifacts/dr24-evidence/setup-failure.txt
      - name: Capture and validate fixed-OID evidence (12 minute limit)
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 12m \
            python scripts/capture_dr24_evidence.py \
              --output-dir artifacts/dr24-evidence/bundle \
              --software-commit "$GITHUB_SHA" \
            2>&1 | tee artifacts/dr24-evidence/runner.log
      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dr24-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dr24-evidence/
          if-no-files-found: warn
          retention-days: 30
