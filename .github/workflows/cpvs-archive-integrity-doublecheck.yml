name: CPVS raw archive integrity double-check

on:
  push:
    branches:
      - research/cpvs-archive-integrity-doublecheck-20261116
    paths:
      - .github/workflows/cpvs-archive-integrity-doublecheck.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpvs-archive-integrity-doublecheck
  cancel-in-progress: false

jobs:
  archive-integrity:
    name: Independently validate pinned CPVS ZIP archives
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download pinned mismatch and Table 2 evidence
        uses: actions/download-artifact@v4
        with:
          name: cpvs-full-parent-reconstruction-evidence
          path: inputs/full-parent
          repository: ${{ github.repository }}
          run-id: 43600721277
          github-token: ${{ github.token }}

      - name: Download pinned Table 2 reconciliation
        uses: actions/download-artifact@v4
        with:
          name: cpvs-raw-cds-reconciliation
          path: inputs/reconciliation
          repository: ${{ github.repository }}
          run-id: 41367972395
          github-token: ${{ github.token }}

      - name: Download checksum-pinned Zenodo archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw reports
          curl --fail --location --retry 4 --retry-all-errors \
            "https://zenodo.org/records/3886372/files/ztf2g.zip?download=1" \
            --output raw/ztf2g.zip
          curl --fail --location --retry 4 --retry-all-errors \
            "https://zenodo.org/records/3886372/files/ztf2r.zip?download=1" \
            --output raw/ztf2r.zip
          echo "47cd1823b3ccdb69fa3085381cf63ff0605f6d841fc3bc37489dce023ddc19b9  raw/ztf2g.zip" | sha256sum --check -
          echo "48331ba1157afc993a1399e094b97752a82d8d0f736d2fdf63fd7b2a82281b74  raw/ztf2r.zip" | sha256sum --check -
          stat -c '%n %s bytes' raw/*.zip

      - name: Independent Info-ZIP CRC validation and Python central-directory audit
        id: zip_audit
        shell: bash
        run: |
          set +e
          mkdir -p reports
          unzip -tq raw/ztf2g.zip > reports/ztf2g_unzip_test.log 2>&1
          g_rc=$?
          unzip -tq raw/ztf2r.zip > reports/ztf2r_unzip_test.log 2>&1
          r_rc=$?
          set -e
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          expected = {
              "g": {
                  "path": "raw/ztf2g.zip",
                  "archive_sha256": "47cd1823b3ccdb69fa3085381cf63ff0605f6d841fc3bc37489dce023ddc19b9",
                  "member": "ztf2g",
                  "member_crc32": "d2f33aa0",
                  "member_bytes": 5034066142,
                  "member_rows": 89697393,
              },
              "r": {
                  "path": "raw/ztf2r.zip",
                  "archive_sha256": "48331ba1157afc993a1399e094b97752a82d8d0f736d2fdf63fd7b2a82281b74",
                  "member": "ztf2r",
                  "member_crc32": "225495a0",
                  "member_bytes": 6175667360,
                  "member_rows": 109971576,
              },
          }
          report = {"method": "Info-ZIP unzip -t plus Python zipfile central-directory inspection",
                    "archives": {}, "interpretation": "DIAGNOSTIC_ONLY"}
          for band, cfg in expected.items():
              path = Path(cfg["path"])
              digest_obj = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest_obj.update(chunk)
              digest = digest_obj.hexdigest()
              with zipfile.ZipFile(path) as zf:
                  matches = [i for i in zf.infolist() if Path(i.filename).name == cfg["member"] and "__MACOSX" not in i.filename]
                  if len(matches) != 1:
                      raise SystemExit(f"{band}: expected exactly one {cfg['member']} member; found {[i.filename for i in matches]}")
                  info = matches[0]
              report["archives"][band] = {
                  "path": str(path),
                  "archive_bytes": path.stat().st_size,
                  "archive_sha256": digest,
                  "archive_sha256_matches": digest == cfg["archive_sha256"],
                  "member_name": info.filename,
                  "central_directory_crc32": f"{info.CRC:08x}",
                  "expected_member_crc32": cfg["member_crc32"],
                  "central_directory_crc_matches": f"{info.CRC:08x}" == cfg["member_crc32"],
                  "uncompressed_bytes": info.file_size,
                  "expected_uncompressed_bytes": cfg["member_bytes"],
                  "uncompressed_size_matches": info.file_size == cfg["member_bytes"],
                  "compressed_bytes": info.compress_size,
                  "expected_rows": cfg["member_rows"],
              }
          Path("reports/cpvs_archive_integrity_doublecheck.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + chr(10), encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          printf 'g_unzip_test_exit=%s\nr_unzip_test_exit=%s\n' "$g_rc" "$r_rc" | tee reports/unzip_test_exit_codes.txt
          if [ "$g_rc" -ne 0 ] || [ "$r_rc" -ne 0 ]; then
            echo "Independent Info-ZIP integrity test failed; do not run lineage scan."
            exit 1
          fi

      - name: Run 100-object coordinate and epoch lineage scan
        if: steps.zip_audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_cpvs_mismatch_lineage.py" -v
          python scripts/diagnose_cpvs_mismatch_lineage.py \
            --table2 inputs/reconciliation/raw/table2.dat \
            --mismatches inputs/full-parent/cpvs_full_parent_rowcount_mismatches.tsv \
            --g-archive raw/ztf2g.zip \
            --r-archive raw/ztf2r.zip \
            --output-dir reports

      - name: Upload compact integrity and lineage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-archive-integrity-doublecheck
          path: |
            reports/cpvs_archive_integrity_doublecheck.json
            reports/ztf2g_unzip_test.log
            reports/ztf2r_unzip_test.log
            reports/unzip_test_exit_codes.txt
            reports/cpvs_mismatch_lineage_report.json
            reports/cpvs_mismatch_object_lineage.tsv
            reports/cpvs_mismatch_coordinate_aliases.tsv
          if-no-files-found: warn
          retention-days: 14
