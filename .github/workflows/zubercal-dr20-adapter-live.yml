name: Zubercal DR20 Adapter Live Parity

on:
  push:
    branches:
      - feat/zubercal-dr20-ambiguous-crossmatch-adapter-20261107
      - ci/dr24-bounded-acceptance-20261112
    paths:
      - .github/workflows/zubercal-dr20-adapter-live.yml
      - src/ztf_classifier/io/zubercal_dr20.py
      - tests/test_zubercal_dr20_adapter_live.py

permissions:
  contents: read

concurrency:
  group: zubercal-dr20-adapter-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-adapter-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZTF_ZUBERCAL_ADAPTER_LIVE_TEST: "1"
      ZUBERCAL_ADAPTER_OUTPUT: reports/scientific_validation/zubercal_dr20_adapter_live.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and remote catalog dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dr24]"
      - name: Verify ambiguity-preserving adapter against live DR20 HATS
        run: python -m pytest -q -s tests/test_zubercal_dr20_adapter_live.py
      - name: Upload adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zubercal-dr20-adapter-live-parity
          path: reports/scientific_validation/zubercal_dr20_adapter_live.json
          if-no-files-found: warn
          retention-days: 30
