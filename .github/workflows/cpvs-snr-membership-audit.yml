name: CPVS independent two-table membership audit

on:
  push:
    branches:
      - investigation/cpvs-snr-membership-audit-20261029

permissions:
  contents: read

jobs:
  audit:
    name: Compare four-field predicate with published Table 4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run independent audit self-test
        run: python scripts/verify_cpvs_four_field_rule.py --self-test

      - name: Download compact published VizieR table extracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpvs-two-table"
          cd "$RUNNER_TEMP/cpvs-two-table"

          fetch_table() {
            local filename="$1" header="$2"
            shift 2
            local url tmp
            for url in "$@"; do
              tmp="${filename}.part"
              rm -f "$tmp"
              echo "Trying source: $url"
              if curl --location --fail --show-error --silent \
                --connect-timeout 15 --max-time 90 \
                --retry 0 \
                "$url" -o "$tmp"; then
                if [[ -s "$tmp" ]] && grep -Fq "$header" "$tmp"; then
                  mv "$tmp" "$filename"
                  printf '%s\t%s\n' "$filename" "$url" >> source-tables.tsv
                  echo "Accepted VizieR extract: $filename"
                  return 0
                fi
                echo "Rejected $url: response missing expected metadata header" >&2
              fi
              rm -f "$tmp"
            done
            echo "ERROR: no source produced a valid TSV extract for $filename" >&2
            return 1
          }

          fetch_table table2.tsv $'#Column\tPer-r' \
            "https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=J/ApJS/249/18/table2&-out=ID,Seq,gmag,rmag,Per-g,Per-r&-out.max=1000000" \
            "https://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J/ApJS/249/18/table2&-out=ID,Seq,gmag,rmag,Per-g,Per-r&-out.max=1000000" \
            "https://vizier.cfa.harvard.edu/viz-bin/asu-tsv?-source=J/ApJS/249/18/table2&-out=ID,Seq,gmag,rmag,Per-g,Per-r&-out.max=1000000"
          fetch_table table4.tsv $'#Column\tZTF' \
            "https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=J/ApJ/932/118/table4&-out=ZTF,ID&-out.max=1000000" \
            "https://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J/ApJ/932/118/table4&-out=ZTF,ID&-out.max=1000000" \
            "https://vizier.cfa.harvard.edu/viz-bin/asu-tsv?-source=J/ApJ/932/118/table4&-out=ZTF,ID&-out.max=1000000"

          sha256sum table2.tsv table4.tsv | tee source-tables.sha256
          cat source-tables.tsv
          wc -l -c table2.tsv table4.tsv

      - name: Compare object-level membership and save exact differences
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cpvs-two-table"
          python "$GITHUB_WORKSPACE/scripts/verify_cpvs_four_field_rule.py" \
            --table2 table2.tsv \
            --table4 table4.tsv \
            --out "$RUNNER_TEMP/cpvs-two-table/cpvs_two_table_audit.json" \
            --dump-ids
          cat "$RUNNER_TEMP/cpvs-two-table/cpvs_two_table_audit.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve field-level provenance for the 55 four-field-only objects
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cpvs-two-table"
          python - <<'PY'
          import csv
          from pathlib import Path

          wanted = {line.strip() for line in Path("cpvs_four_field_only_ids.txt").read_text().splitlines() if line.strip()}
          if len(wanted) != 55:
              raise SystemExit(f"Expected 55 four-field-only IDs, got {len(wanted)}")

          header = None
          rows = {}
          with Path("table2.tsv").open(encoding="utf-8", newline="") as source:
              for raw in source:
                  if not raw.strip() or raw.startswith("#"):
                      continue
                  fields = raw.rstrip("\r\n").split("\t")
                  if header is None:
                      if fields[:6] == ["ID", "Seq", "gmag", "rmag", "Per-g", "Per-r"]:
                          header = fields[:6]
                      continue
                  if fields and fields[0].startswith("---"):
                      continue
                  if len(fields) < 6:
                      raise SystemExit(f"Malformed Table 2 TSV row: {raw[:120]!r}")
                  seq = fields[1].strip()
                  if seq in wanted:
                      if seq in rows:
                          raise SystemExit(f"Duplicate Seq in Table 2 TSV: {seq}")
                      rows[seq] = fields[:6]

          if header is None:
              raise SystemExit("Could not locate expected Table 2 TSV data header")
          if set(rows) != wanted:
              raise SystemExit(f"ID coverage mismatch: missing={sorted(wanted-set(rows))[:10]}, extra={sorted(set(rows)-wanted)[:10]}")

          with Path("cpvs_four_field_only_records.tsv").open("w", encoding="utf-8", newline="") as output:
              writer = csv.writer(output, delimiter="\t", lineterminator="\n")
              writer.writerow(header)
              for seq in sorted(rows, key=int):
                  writer.writerow(rows[seq])

          print(f"Saved {len(rows)} exact object records with ZTF name, Seq, and all four predicate fields.")
          PY

          sha256sum cpvs_four_field_only_records.tsv | tee -a source-tables.sha256
          cat cpvs_four_field_only_records.tsv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload two-table audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-independent-two-table-audit
          path: |
            ${{ runner.temp }}/cpvs-two-table/cpvs_two_table_audit.json
            ${{ runner.temp }}/cpvs-two-table/cpvs_four_field_only_ids.txt
            ${{ runner.temp }}/cpvs-two-table/cpvs_published_only_ids.txt
            ${{ runner.temp }}/cpvs-two-table/cpvs_four_field_only_records.tsv
            ${{ runner.temp }}/cpvs-two-table/source-tables.sha256
            ${{ runner.temp }}/cpvs-two-table/source-tables.tsv
          if-no-files-found: warn
          retention-days: 30
