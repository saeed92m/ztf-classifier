name: CPVS independent two-table membership audit

on:
  push:
    branches:
      - investigation/cpvs-snr-membership-audit-20261029

permissions:
  contents: read

jobs:
  audit:
    name: Compare four-field predicate with published Table 4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run independent audit self-test
        run: python scripts/verify_cpvs_four_field_rule.py --self-test

      - name: Download the two published CDS tables only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpvs-two-table"
          cd "$RUNNER_TEMP/cpvs-two-table"

          curl --location --fail --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --max-time 900 \
            "https://cdsarc.cds.unistra.fr/ftp/J/ApJS/249/18/table2.dat" \
            -o table2.dat
          curl --location --fail --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --max-time 900 \
            "https://cdsarc.cds.unistra.fr/ftp/J/ApJ/932/118/table4.dat" \
            -o table4.dat

          test -s table2.dat
          test -s table4.dat
          sha256sum table2.dat table4.dat | tee source-tables.sha256
          wc -l -c table2.dat table4.dat

      - name: Compare object-level membership and save exact differences
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cpvs-two-table"
          python "$GITHUB_WORKSPACE/scripts/verify_cpvs_four_field_rule.py" \
            --table2 table2.dat \
            --table4 table4.dat \
            --out "$GITHUB_WORKSPACE/cpvs_two_table_audit.json" \
            --dump-ids
          cp source-tables.sha256 "$GITHUB_WORKSPACE/source-tables.sha256"
          cat "$GITHUB_WORKSPACE/cpvs_two_table_audit.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload two-table audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-independent-two-table-audit
          path: |
            cpvs_two_table_audit.json
            cpvs_four_field_only_ids.txt
            cpvs_published_only_ids.txt
            source-tables.sha256
            ${{ runner.temp }}/cpvs-two-table/source-tables.sha256
          if-no-files-found: warn
          retention-days: 30
