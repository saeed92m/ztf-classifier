name: CPVS independent two-table membership audit

on:
  push:
    branches:
      - investigation/cpvs-snr-membership-audit-20261029

permissions:
  contents: read

jobs:
  audit:
    name: Compare four-field predicate with published Table 4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run independent audit self-test
        run: python scripts/verify_cpvs_four_field_rule.py --self-test

      - name: Download the two published CDS tables only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpvs-two-table"
          cd "$RUNNER_TEMP/cpvs-two-table"

          # Try the primary CDS host, then established VizieR mirrors. Each
          # candidate is accepted only if the published row count matches.
          fetch_table() {
            local filename="$1" expected_rows="$2"
            shift 2
            local url tmp rows
            for url in "$@"; do
              tmp="${filename}.part"
              rm -f "$tmp"
              echo "Trying source: $url"
              if curl --location --fail --show-error --silent \
                --connect-timeout 15 --max-time 900 \
                --retry 1 --retry-all-errors --retry-delay 2 \
                "$url" -o "$tmp"; then
                rows="$(wc -l < "$tmp" | tr -d ' ')"
                if [[ -s "$tmp" && "$rows" == "$expected_rows" ]]; then
                  mv "$tmp" "$filename"
                  printf '%s\t%s\t%s\n' "$filename" "$url" "$rows" >> source-tables.tsv
                  echo "Accepted $filename ($rows rows) from $url"
                  return 0
                fi
                echo "Rejected $url: expected $expected_rows rows, got ${rows:-0}" >&2
              fi
              rm -f "$tmp"
            done
            echo "ERROR: no source produced $filename with $expected_rows rows" >&2
            return 1
          }

          fetch_table table2.dat 781602 \
            "https://cdsarc.cds.unistra.fr/ftp/J/ApJS/249/18/table2.dat" \
            "https://vizier.cfa.harvard.edu/ftp/J/ApJS/249/18/table2.dat" \
            "https://vizier.nao.ac.jp/ftp/J/ApJS/249/18/table2.dat" \
            "https://vizier.idia.ac.za/ftp/J/ApJS/249/18/table2.dat"
          fetch_table table4.dat 730184 \
            "https://cdsarc.cds.unistra.fr/ftp/J/ApJ/932/118/table4.dat" \
            "https://vizier.cfa.harvard.edu/ftp/J/ApJ/932/118/table4.dat" \
            "https://vizier.nao.ac.jp/ftp/J/ApJ/932/118/table4.dat" \
            "https://vizier.idia.ac.za/ftp/J/ApJ/932/118/table4.dat"

          sha256sum table2.dat table4.dat | tee source-tables.sha256
          cat source-tables.tsv
          wc -l -c table2.dat table4.dat

      - name: Compare object-level membership and save exact differences
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cpvs-two-table"
          python "$GITHUB_WORKSPACE/scripts/verify_cpvs_four_field_rule.py" \
            --table2 table2.dat \
            --table4 table4.dat \
            --out "$RUNNER_TEMP/cpvs-two-table/cpvs_two_table_audit.json" \
            --dump-ids
          cat "$RUNNER_TEMP/cpvs-two-table/cpvs_two_table_audit.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload two-table audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-independent-two-table-audit
          path: |
            ${{ runner.temp }}/cpvs-two-table/cpvs_two_table_audit.json
            ${{ runner.temp }}/cpvs-two-table/cpvs_four_field_only_ids.txt
            ${{ runner.temp }}/cpvs-two-table/cpvs_published_only_ids.txt
            ${{ runner.temp }}/cpvs-two-table/source-tables.sha256
            ${{ runner.temp }}/cpvs-two-table/source-tables.tsv
          if-no-files-found: warn
          retention-days: 30
