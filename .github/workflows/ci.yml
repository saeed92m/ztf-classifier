name: CI

on:
  push:
    branches:
      - main
      - "chore/complete-upgrade-v0.4"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 - Lint, Test, Build, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Install project without dependency resolution
        run: python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Record resolved environment
        run: python -m pip freeze | sort

      - name: Run Ruff lint
        run: python -m ruff check src tests

      - name: Run Ruff format check
        run: python -m ruff format --check src tests

      - name: Run test suite with coverage
        run: |
          python -m pytest -q \
            --cov=ztf_classifier \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Build package
        run: python -m build

      - name: Install built wheel and verify dependencies
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check

      - name: Verify package import
        run: python -c "import ztf_classifier; print(ztf_classifier.__file__)"

      - name: Audit dependencies
        run: python -m pip_audit
