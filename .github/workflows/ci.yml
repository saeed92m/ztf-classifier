name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run Ruff lint
        run: python -m ruff check src tests

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock

      - name: Run Ruff format check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF:-main}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${GITHUB_BASE_REF:-main}...HEAD" -- 'src/**/*.py' 'tests/**/*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python source/test files require formatting validation."
            exit 0
          fi
          python -m ruff format --check "${files[@]}"


  cumulative-lifecycle:
    name: Cumulative Lifecycle Gate
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Validate every cumulative cycle record
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(configs/process/cycles/*.json)
          test ${#records[@]} -gt 0
          python -m ztf_classifier.lifecycle validate "${records[@]}"

      - name: Require a cycle record for meaningful pull requests
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --depth=1
          mapfile -t changed < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          meaningful=()
          for path in "${changed[@]}"; do
            case "$path" in
              configs/process/cycles/*) ;;
              .gitignore|.gitattributes) ;;
              *) meaningful+=("$path") ;;
            esac
          done
          if [ "${#meaningful[@]}" -gt 0 ]; then
            has_record=false
            for path in "${changed[@]}"; do
              case "$path" in
                configs/process/cycles/*.json) has_record=true ;;
              esac
            done
            if [ "$has_record" != true ]; then
              echo "Meaningful PR changes require a machine-readable cumulative cycle record under configs/process/cycles/."
              printf 'Changed files:\n%s\n' "${meaningful[*]}"
              exit 1
            fi
          fi
          echo "Cumulative cycle-record requirement satisfied."

  test:
    name: Test Suite
    needs: cumulative-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run test suite with coverage
        run: |
          python -m pytest -q \
            --cov=ztf_classifier \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-reports-${{ github.run_id }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: error

  smoke:
    name: Runtime Smoke Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Smoke test CLI entry point
        run: ztf-classifier --help

      - name: Smoke test API entry point
        run: python -c "from ztf_classifier.api.server import main; assert callable(main)"

      - name: Smoke test worker entry point
        run: python -c "from ztf_classifier.jobs.runner import main; assert callable(main)"

  build:
    name: Build & Verify Package
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock

      - name: Build package
        run: python -m build

      - name: Install built wheel and verify dependencies
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check

      - name: Verify package import
        run: python -c "import ztf_classifier; print(ztf_classifier.__file__)"

  audit:
    name: Dependency Audit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -r requirements.lock

      # Build-system isolation audit (Python build deps only, not OS)
      - name: Audit build-system isolation
        run: |
          set -euo pipefail
          echo "=== Extract combined build requires (public API) ==="
          # Backend hooks execute in child processes, so redirecting Python-level stdout is insufficient.
          python << 'PY' > /tmp/build-requires.txt
          import os
          import subprocess
          import sys
          from pathlib import Path
          from build import ProjectBuilder

          diagnostics = []
          def quiet_runner(command, cwd=None, extra_environ=None):
              env = os.environ.copy()
              env.update(extra_environ or {})
              result = subprocess.run(
                  command, cwd=cwd, env=env, stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT, text=True, check=False
              )
              diagnostics.append(result.stdout or "")
              if result.returncode:
                  sys.stderr.write(result.stdout or "")
                  raise subprocess.CalledProcessError(result.returncode, command)

          builder = ProjectBuilder(".", runner=quiet_runner)
          requirements = (
              builder.build_system_requires
              | builder.get_requires_for_build("wheel")
              | builder.get_requires_for_build("sdist")
          )
          Path("/tmp/build-require-discovery.log").write_text("".join(diagnostics))
          print("\n".join(sorted(requirements)))
          PY
          echo "=== Build-backend discovery diagnostics (if any) ==="
          cat /tmp/build-require-discovery.log
          mapfile -t REQS < /tmp/build-requires.txt
          printf 'REQS: %s\n' "${REQS[*]}"
          test "${#REQS[@]}" -gt 0
          echo "=== Canonical resolve (direct+transitive) ==="
          python -m pip install --dry-run --report /tmp/pip-report-build.json --ignore-installed "${REQS[@]}"
          python -c "import json, pathlib; p=pathlib.Path('/tmp/pip-report-build.json'); assert p.exists(), 'missing report is error'; d=json.loads(p.read_text()); assert d.get('install'), 'empty report is error, not healthy'; print(f\"pip {d['pip_version']} resolves {len(d['install'])}:\"); [print(f\"  {i['metadata']['name']}=={i['metadata']['version']} requested={i['requested']}\") for i in d['install']]"
          cat /tmp/pip-report-build.json | python -m json.tool > /tmp/pip-report-build.pretty.json
          echo "=== Rebuild isolated env (stable venv+pip) ==="
          rm -rf /tmp/isolated-build-audit
          python -m venv --without-pip /tmp/isolated-build-audit
          python -m pip --python /tmp/isolated-build-audit/bin/python install "${REQS[@]}"
          PURELIB=$(python -c "import sysconfig; v=sysconfig.get_config_vars().copy(); v['base']='/tmp/isolated-build-audit'; print(sysconfig.get_paths(vars=v)['purelib'])")
          echo "purelib: $PURELIB"
          python -c "import importlib.metadata, sysconfig; v=sysconfig.get_config_vars().copy(); v['base']='/tmp/isolated-build-audit'; p=sysconfig.get_paths(vars=v)['purelib']; dists=list(importlib.metadata.distributions(path=[p])); assert dists, 'empty purelib is error'; [print(f\"  {d.name}=={d.version}\") for d in dists]"
          echo "=== Compare resolved vs installed (normalized) ==="
          python << 'PY'
          import json, sysconfig, importlib.metadata
          from packaging.utils import canonicalize_name
          report=json.load(open('/tmp/pip-report-build.json'))
          resolved={(canonicalize_name(i['metadata']['name']), i['metadata']['version']) for i in report['install']}
          v=sysconfig.get_config_vars().copy(); v['base']='/tmp/isolated-build-audit'; p=sysconfig.get_paths(vars=v)['purelib']
          installed={(canonicalize_name(d.name), d.version) for d in importlib.metadata.distributions(path=[p])}
          print(f"resolved {sorted(resolved)}")
          print(f"installed {sorted(installed)}")
          assert resolved, "empty resolved is error"
          assert installed, "empty installed is error"
          if resolved != installed:
              raise SystemExit(f"mismatch missing={resolved-installed} extra={installed-resolved}")
          print("PASS resolved==installed (normalized direct+transitive)")
          PY
          echo "=== Audit must not confuse error with healthy ==="
          python -m pip_audit --path "$PURELIB" --format=json --output /tmp/audit-build.json
          cat /tmp/audit-build.json | python -m json.tool
          python << 'PY'
          import json, pathlib, sysconfig, importlib.metadata, sys
          from packaging.utils import canonicalize_name
          p="/tmp/audit-build.json"
          assert pathlib.Path(p).exists(), "missing audit JSON is error, not healthy"
          data=json.loads(pathlib.Path(p).read_text())
          assert "dependencies" in data, f"missing key {data.keys()} is error"
          assert data["dependencies"], "empty dependencies for non-empty purelib is error"
          v=sysconfig.get_config_vars().copy(); v['base']='/tmp/isolated-build-audit'; pure=sysconfig.get_paths(vars=v)['purelib']
          installed={(canonicalize_name(d.name), d.version) for d in importlib.metadata.distributions(path=[pure])}
          audited={(canonicalize_name(x['name']), x['version']) for x in data['dependencies']}
          print(f"audited {sorted(audited)}")
          if installed != audited:
              raise SystemExit(f"audit does not cover all installed: missing={installed-audited}")
          vulns=sum(len(x['vulns']) for x in data["dependencies"])
          print(f"Audited {len(data['dependencies'])} deps, {vulns} vulns")
          sys.exit(1 if vulns>0 else 0)
          PY

      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            python -m pip_audit && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1


  cpvs-targeted-zenodo-audit:
    name: CPVS 17-object direct Zenodo membership audit
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'investigation/cpvs-candidate-field-audit-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Download Table 2 ID-to-SourceID crosswalk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpvs"
          tmp="$RUNNER_TEMP/cpvs/table2.tsv.part"
          ok=0
          ids="9877,120746,127012,151010,191955,281946,287003,307249,378719,385223,409233,429716,440167,471637,518053,657950,732333"
          adql="SELECT \"ID\", \"Seq\" FROM \"J/ApJS/249/18/table2\" WHERE \"Seq\" IN (${ids})"

          # Prefer TAP/ADQL; retain ASU-TSV mirrors as a fallback.
          rm -f "$tmp"
          if curl -L --fail --show-error --silent --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors --retry-delay 3 \
            --data-urlencode "REQUEST=doQuery" \
            --data-urlencode "LANG=ADQL" \
            --data-urlencode "FORMAT=tsv" \
            --data-urlencode "QUERY=$adql" \
            "https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync" -o "$tmp" && test -s "$tmp"; then
            mv "$tmp" "$RUNNER_TEMP/cpvs/table2.tsv"
            ok=1
          fi

          if [ "$ok" -eq 0 ]; then
            for url in \
              "https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=J/ApJS/249/18/table2&-out=ID,Seq&Seq=${ids}&-out.max=1000" \
              "https://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J/ApJS/249/18/table2&-out=ID,Seq&Seq=${ids}&-out.max=1000" \
              "https://vizier.cfa.harvard.edu/viz-bin/asu-tsv?-source=J/ApJS/249/18/table2&-out=ID,Seq&Seq=${ids}&-out.max=1000"; do
              rm -f "$tmp"
              if curl --http1.1 -L --fail --show-error --silent --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors --retry-delay 3 "$url" -o "$tmp" && test -s "$tmp"; then
                mv "$tmp" "$RUNNER_TEMP/cpvs/table2.tsv"
                ok=1
                break
              fi
            done
          fi
          test "$ok" -eq 1 || { echo "Could not acquire validated Table 2 crosswalk from any mirror" >&2; exit 1; }
          sha256sum "$RUNNER_TEMP/cpvs/table2.tsv"

      - name: Download and verify alternate Zenodo membership
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent --connect-timeout 20 --max-time 300 --retry 2 --retry-all-errors \
            "https://zenodo.org/records/5764899/files/Zenodo.zip" -o "$RUNNER_TEMP/cpvs/Zenodo.zip"
          echo "7fc6562d4208cbfa97366351984810e3  $RUNNER_TEMP/cpvs/Zenodo.zip" | md5sum --check -
          unzip -p "$RUNNER_TEMP/cpvs/Zenodo.zip" 1st_layer.csv > "$RUNNER_TEMP/cpvs/1st_layer.csv"
          test -s "$RUNNER_TEMP/cpvs/1st_layer.csv"
          sha256sum "$RUNNER_TEMP/cpvs/1st_layer.csv"

      - name: Crosswalk and compare the 17 residual objects directly
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/cpvs/table2.tsv" "$RUNNER_TEMP/cpvs/1st_layer.csv" "$RUNNER_TEMP/cpvs/17_object_zenodo_audit.json" <<'PY'
          import csv, hashlib, json, sys
          from pathlib import Path

          table2_path, zenodo_path, output_path = map(Path, sys.argv[1:])
          target_ids = [9877, 120746, 127012, 151010, 191955, 281946, 287003, 307249, 378719, 385223, 409233, 429716, 440167, 471637, 518053, 657950, 732333]

          header = None
          metadata_columns = {}
          by_seq = {}
          raw_preview = []
          with table2_path.open(encoding="utf-8-sig", newline="") as stream:
              for raw in stream:
                  line = raw.rstrip("\r\n")
                  if len(raw_preview) < 30:
                      raw_preview.append(line)
                  if not line.strip():
                      continue
                  if line.startswith("#Column"):
                      parts = line.split("\t")
                      # Standard VizieR metadata: #Column<TAB>index<TAB>name...
                      if len(parts) >= 3 and parts[1].strip().isdigit():
                          metadata_columns[int(parts[1].strip())] = parts[2].strip()
                      continue
                  if line.startswith("#"):
                      continue
                  fields = [value.strip() for value in line.split("\t")]
                  if header is None and metadata_columns:
                      header = [metadata_columns[i] for i in sorted(metadata_columns)]
                  if header is None and all(k in fields for k in ("ID", "Seq")):
                      header = fields
                      continue
                  if header is None:
                      continue
                  if len(fields) != len(header) or fields == header:
                      continue
                  row = dict(zip(header, fields))
                  try:
                      seq = int(row["Seq"])
                  except (KeyError, ValueError):
                      continue
                  name = row.get("ID", "").strip()
                  if not name:
                      raise SystemExit(f"Table 2 row for Seq={seq} has an empty ID")
                  if seq in by_seq:
                      raise SystemExit(f"duplicate Table 2 Seq {seq}")
                  by_seq[seq] = name
          if header is None and metadata_columns:
              header = [metadata_columns[i] for i in sorted(metadata_columns)]
          if header is None or not all(k in header for k in ("ID", "Seq")):
              diagnostic = "\n".join(raw_preview)
              raise SystemExit(
                  "Table 2 response has no parseable ID/Seq schema. "
                  f"metadata_columns={metadata_columns}; first_lines:\\n{diagnostic}"
              )
          if not by_seq:
              raise SystemExit(
                  f"Table 2 schema parsed as {header}, but no data rows were parsed. "
                  "Refusing to infer a crosswalk."
              )
          missing = sorted(set(target_ids) - set(by_seq))
          unexpected = sorted(set(by_seq) - set(target_ids))
          if missing:
              raise SystemExit(f"Target SourceIDs absent from Table 2 Seq after parsing validated header {header}: {missing}")
          if unexpected or len(by_seq) != len(target_ids):
              raise SystemExit(
                  "Targeted VizieR query did not return exactly the requested SourceIDs; "
                  f"unexpected={unexpected}, observed={len(by_seq)}, expected={len(target_ids)}"
              )

          with zenodo_path.open(encoding="utf-8-sig", newline="") as stream:
              reader = csv.DictReader(stream)
              if not reader.fieldnames or "ID" not in reader.fieldnames:
                  raise SystemExit(f"Zenodo CSV has no ID column: {reader.fieldnames}")
              zenodo_names = set()
              for row in reader:
                  name = (row.get("ID") or "").strip()
                  if name:
                      zenodo_names.add(name)

          records = []
          for seq in target_ids:
              name = by_seq[seq]
              records.append({"source_id": seq, "ztf_name": name, "in_zenodo_membership": name in zenodo_names})
          matched = sum(r["in_zenodo_membership"] for r in records)
          report = {
              "status": "COMPLETED",
              "reference": "Zenodo 10.5281/zenodo.5764899, 1st_layer.csv",
              "join_key": "Table 2 ZTF ID string; SourceID is crosswalked via Table 2 Seq",
              "target_count": len(target_ids),
              "zenodo_unique_name_count": len(zenodo_names),
              "in_reference_count": matched,
              "not_in_reference_count": len(records) - matched,
              "inputs": {
                  "table2_sha256": hashlib.sha256(table2_path.read_bytes()).hexdigest(),
                  "zenodo_csv_sha256": hashlib.sha256(zenodo_path.read_bytes()).hexdigest(),
              },
              "objects": records,
          }
          output_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload direct membership audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpvs-17-object-zenodo-membership-audit
          path: ${{ runner.temp }}/cpvs/17_object_zenodo_audit.json
          if-no-files-found: warn

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - audit
      - cpvs-targeted-zenodo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable gated stages to pass
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          CPVS_RESULT: ${{ needs.cpvs-targeted-zenodo-audit.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUDIT_RESULT" != "success" ]; then
            echo "Dependency audit failed or was cancelled: $AUDIT_RESULT"
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" = "investigation/cpvs-candidate-field-audit-20261030" ]; then
            if [ "$CPVS_RESULT" != "success" ]; then
              echo "CPVS scientific membership audit is not successful: $CPVS_RESULT"
              exit 1
            fi
          fi
          echo "All applicable gated stages passed."
