name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run Ruff lint
        run: python -m ruff check src tests

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock

      - name: Run Ruff format check
        run: python -m ruff format --check src tests


  cumulative-lifecycle:
    name: Cumulative Lifecycle Gate
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Validate every cumulative cycle record
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(configs/process/cycles/*.json)
          test ${#records[@]} -gt 0
          python -m ztf_classifier.lifecycle validate "${records[@]}"

      - name: Require a cycle record for meaningful pull requests
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --depth=1
          mapfile -t changed < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          meaningful=()
          for path in "${changed[@]}"; do
            case "$path" in
              configs/process/cycles/*) ;;
              .gitignore|.gitattributes) ;;
              *) meaningful+=("$path") ;;
            esac
          done
          if [ "${#meaningful[@]}" -gt 0 ]; then
            has_record=false
            for path in "${changed[@]}"; do
              case "$path" in
                configs/process/cycles/*.json) has_record=true ;;
              esac
            done
            if [ "$has_record" != true ]; then
              echo "Meaningful PR changes require a machine-readable cumulative cycle record under configs/process/cycles/."
              printf 'Changed files:\n%s\n' "${meaningful[*]}"
              exit 1
            fi
          fi
          echo "Cumulative cycle-record requirement satisfied."

  test:
    name: Test Suite
    needs: cumulative-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run test suite with coverage
        run: |
          python -m pytest -q \
            --cov=ztf_classifier \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports-${{ github.run_id }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: error

  smoke:
    name: Runtime Smoke Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Smoke test CLI entry point
        run: ztf-classifier --help

      - name: Smoke test API entry point
        run: python -c "from ztf_classifier.api.server import main; assert callable(main)"

      - name: Smoke test worker entry point
        run: python -c "from ztf_classifier.jobs.runner import main; assert callable(main)"

  build:
    name: Build & Verify Package
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock

      - name: Build package
        run: python -m build

      - name: Install built wheel and verify dependencies
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check

      - name: Verify package import
        run: python -c "import ztf_classifier; print(ztf_classifier.__file__)"

  audit:
    name: Dependency Audit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock

      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            python -m pip_audit && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all gated stages to pass
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          if [ "$AUDIT_RESULT" != "success" ]; then
            echo "Final gated CI stage failed or was cancelled: $AUDIT_RESULT"
            exit 1
          fi
          echo "All gated CI stages passed."
