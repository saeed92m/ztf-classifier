name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run Ruff lint
        run: python -m ruff check src tests

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock

      - name: Run Ruff format check
        run: |
          python -m ruff format --check \
            src/ztf_classifier/reproducibility/checksums.py \
            src/ztf_classifier/reproducibility/__init__.py \
            tests/test_checksums.py \
            tests/test_alerce_ingestion_diagnostics.py \
            tests/test_prediction_result_statuses.py \
            src/ztf_classifier/api/__init__.py \
            src/ztf_classifier/api/app.py \
            src/ztf_classifier/api/config.py \
            src/ztf_classifier/api/errors.py \
            src/ztf_classifier/api/schemas.py \
            src/ztf_classifier/api/server.py \
            tests/test_api.py \
            src/ztf_classifier/features/contracts.py \
            src/ztf_classifier/features/engine.py \
            src/ztf_classifier/incremental/__init__.py \
            src/ztf_classifier/incremental/checkpoints.py \
            src/ztf_classifier/incremental/cursor.py \
            src/ztf_classifier/jobs/executor.py \
            src/ztf_classifier/jobs/store.py \
            src/ztf_classifier/jobs/worker.py \
            src/ztf_classifier/jobs/__init__.py \
            tests/test_feature_engine.py \
            tests/test_incremental.py \
            tests/test_jobs_worker.py \
            src/ztf_classifier/catalog/__init__.py \
            src/ztf_classifier/catalog/service.py \
            src/ztf_classifier/reporting/__init__.py \
            src/ztf_classifier/reporting/service.py \
            src/ztf_classifier/results/store.py \
            src/ztf_classifier/results/__init__.py \
            tests/test_catalog.py \
            tests/test_reporting.py \
            tests/test_scientific_result_store.py
            src/ztf_classifier/lifecycle.py
            src/ztf_classifier/lifecycle_schema.py
            tests/test_cumulative_lifecycle.py


  cumulative-lifecycle:
    name: Cumulative Lifecycle Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Validate every cumulative cycle record
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(configs/process/cycles/*.json)
          test \${#records[@]} -gt 0
          python -m ztf_classifier.lifecycle validate "\${records[@]}"

      - name: Require a cycle record for meaningful pull requests
        if: \${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "\${GITHUB_BASE_REF}" --depth=1
          mapfile -t changed < <(git diff --name-only "origin/\${GITHUB_BASE_REF}...HEAD")
          meaningful=()
          for path in "\${changed[@]}"; do
            case "\$path" in
              configs/process/cycles/*) ;;
              .gitignore|.gitattributes) ;;
              *) meaningful+=("\$path") ;;
            esac
          done
          if [ "\${#meaningful[@]}" -gt 0 ]; then
            has_record=false
            for path in "\${changed[@]}"; do
              case "\$path" in
                configs/process/cycles/*.json) has_record=true ;;
              esac
            done
            if [ "\$has_record" != true ]; then
              echo "Meaningful PR changes require a machine-readable cumulative cycle record under configs/process/cycles/."
              printf 'Changed files:\n%s\n' "\${meaningful[*]}"
              exit 1
            fi
          fi
          echo "Cumulative cycle-record requirement satisfied."

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run test suite with coverage
        run: |
          python -m pytest -q \
            --cov=ztf_classifier \
            --cov-report=term-missing \
            --cov-report=xml

  build:
    name: Build & Verify Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock

      - name: Build package
        run: python -m build

      - name: Install built wheel and verify dependencies
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check

      - name: Verify package import
        run: python -c "import ztf_classifier; print(ztf_classifier.__file__)"

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock

      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            python -m pip_audit && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - lint
      - format
      - cumulative-lifecycle
      - test
      - build
      - audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all parallel checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          CUMULATIVE_RESULT: ${{ needs.cumulative-lifecycle.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          for result in "$LINT_RESULT" "$FORMAT_RESULT" "$CUMULATIVE_RESULT" "$TEST_RESULT" "$BUILD_RESULT" "$AUDIT_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "CI check failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All parallel CI checks passed."
