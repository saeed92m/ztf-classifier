name: Release

on:
  workflow_run:
    workflows:
      - Scientific Validation
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve release target
        id: target
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          event_sha = os.environ["EVENT_SHA"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = f"v{version}"
          if not tag.startswith("v1."):
              raise SystemExit(f"release workflow is frozen for v1.x publication; derived tag: {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(
                  f'tag={tag}\n'
                  f'sha={event_sha}\n'
                  f'validation_run_id={os.environ["VALIDATION_RUN_ID"]}\n'
              )

          PY

      - name: Download scientific validation evidence
        uses: actions/download-artifact@v8
        with:
          name: scientific-validation-heavy
          path: ${{ runner.temp }}/scientific-evidence
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download external source evidence
        uses: actions/download-artifact@v8
        with:
          name: scientific-validation-external-source-evidence
          path: ${{ runner.temp }}/scientific-external-evidence
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen ALeRCE evidence
        uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-alerce_reference_frozen_20200609
          path: ${{ runner.temp }}/scientific-frozen-alerce
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen CPVS evidence
        uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-ztf_periodic_730k_published
          path: ${{ runner.temp }}/scientific-frozen-cpvs
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve an immutable-safe release tag
        id: ref
        shell: bash
        env:
          REQUESTED_TAG: ${{ steps.target.outputs.tag }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          selected="$REQUESTED_TAG"
          existing_immutable=false
          suffix=0
          while true; do
            release_json=""
            if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${selected}" 2>/dev/null)"; then
              immutable="$(jq -r '.immutable // false' <<<"$release_json")"
              release_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${selected}" 2>/dev/null | jq -r '.object.sha // empty' || true)"
              asset_count="$(jq '.assets | length' <<<"$release_json")"
              if [ "$immutable" = "true" ]; then
                if [ "$release_tag_sha" = "$EXPECTED_SHA" ] && [ "$asset_count" -ge 2 ]; then
                  echo "Immutable release already complete at validated SHA: $selected"
                else
                  echo "Immutable release already exists at $release_tag_sha; refusing to mutate or delete immutable release $selected."
                fi
                existing_immutable=true
                EXPECTED_SHA="$release_tag_sha"
                break
              else
                echo "Mutable release exists and will be repaired in place: $selected"
                break
              fi
            else
              tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${selected}" 2>/dev/null | jq -r '.object.sha // empty' || true)"
              if [ -z "$tag_sha" ]; then
                echo "Release tag is free: $selected"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"                   -f "ref=refs/tags/${selected}"                   -f "sha=${EXPECTED_SHA}" >/tmp/tag-created.json
                break
              fi
              if [ "$tag_sha" = "$EXPECTED_SHA" ]; then
                echo "Existing tag points to validated SHA: $selected"
                break
              fi
              echo "Stale pre-release tag $selected points to $tag_sha, expected $EXPECTED_SHA"
              echo "Deleting stale tag so the immutable release can be created at the validated SHA."
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${selected}"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${selected}" \
                -f "sha=${EXPECTED_SHA}" >/tmp/tag-recreated.json
              echo "Recreated validated tag: $selected"
              break
            fi
          done
          {
            echo "tag=$selected"
            echo "sha=$EXPECTED_SHA"
            echo "existing_immutable=$existing_immutable"
            echo "asset_count=${asset_count:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout validated release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Verify validated tag
        env:
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Restore scientific evidence
        if: steps.ref.outputs.existing_immutable != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/scientific-evidence"
          root="$source"
          [ -d "$source/reports/scientific_validation" ] && root="$source/reports/scientific_validation"
          [ -d "$source/scientific_validation" ] && root="$source/scientific_validation"
          mkdir -p reports
          rm -rf reports/scientific_validation
          mv "$root" reports/scientific_validation
          if [ -d "$RUNNER_TEMP/scientific-external-evidence" ]; then
            mkdir -p reports/scientific_validation/external_source_evidence
            find "$RUNNER_TEMP/scientific-external-evidence" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/external_source_evidence {} +
          fi
          if [ -d "$RUNNER_TEMP/scientific-frozen-alerce" ]; then
            mkdir -p reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609
            find "$RUNNER_TEMP/scientific-frozen-alerce" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609 {} +
          fi
          if [ -d "$RUNNER_TEMP/scientific-frozen-cpvs" ]; then
            mkdir -p reports/scientific_validation/frozen_reference/ztf_periodic_730k_published
            find "$RUNNER_TEMP/scientific-frozen-cpvs" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/ztf_periodic_730k_published {} +
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install locked dependencies
        if: steps.ref.outputs.existing_immutable != 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install build

      - name: Verify package version
        if: steps.ref.outputs.existing_immutable != 'true'
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          tag=os.environ["RELEASE_TAG"]
          actual=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert actual == tag.removeprefix("v").split("-",1)[0], (actual, tag)
          PY

      - name: Enforce scientific validation gate
        if: steps.ref.outputs.existing_immutable != 'true'
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
          VALIDATION_RUN_ID: ${{ steps.target.outputs.validation_run_id }}
        run: |
          python -m pip install -e .
          if [[ "$RELEASE_TAG" == "v0.5.0" || "$RELEASE_TAG" == "v0.5.0-release" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("reports/scientific_validation")
          required=[
            root/"ztf_periodic_781k"/"Table2.txt.zip.evidence.json",
            root/"ztf_periodic_730k"/"cpvs_reconstruction_status.json",
            root/"ztf_star_embed",
            root/"external_source_evidence"/"ztf_dr24_source_subset"/"response.tsv.evidence.json",
            root/"external_source_evidence"/"alerce_reference"/"response.tsv.evidence.json",
            root/"frozen_reference"/"alerce_reference_frozen_20200609"/"evidence_manifest.json",
            root/"frozen_reference"/"ztf_periodic_730k_published"/"evidence_manifest.json",
          ]
          missing=[str(x) for x in required if not x.exists()]
          if missing: raise SystemExit("missing scientific evidence:\n"+"\n".join(missing))
          cpvs=json.loads((root/"ztf_periodic_730k"/"cpvs_reconstruction_status.json").read_text())
          if cpvs.get("product_gate_effect") != "none":
              raise SystemExit("CPVS evidence is not isolated from product gate")
          PY
          else
            # The Scientific Validation workflow is the authoritative producer of
            # release evidence. The release job must validate those immutable
            # artifacts, not re-run a benchmark runner that is not part of the
            # source-backed acquisition workflow.
            python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports/scientific_validation")
          required = [
              root / "ztf_periodic_781k" / "Table2.txt.zip.evidence.json",
              root / "ztf_periodic_730k" / "cpvs_reconstruction_status.json",
              root / "ztf_star_embed.acquisition.json",
              root / "external_source_evidence" / "ztf_dr24_source_subset" / "response.tsv.evidence.json",
              root / "external_source_evidence" / "alerce_reference" / "response.tsv.evidence.json",
              root / "frozen_reference" / "alerce_reference_frozen_20200609" / "evidence_manifest.json",
              root / "frozen_reference" / "ztf_periodic_730k_published" / "evidence_manifest.json",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("missing release scientific evidence:\\n" + "\\n".join(missing))

          cpvs = json.loads((root / "ztf_periodic_730k" / "cpvs_reconstruction_status.json").read_text(encoding="utf-8"))
          if cpvs.get("product_gate_effect") != "none":
              raise SystemExit("CPVS external-reproduction evidence is incorrectly affecting the product gate")

          for path in (
              root / "external_source_evidence" / "ztf_dr24_source_subset" / "response.tsv.evidence.json",
              root / "external_source_evidence" / "alerce_reference" / "response.tsv.evidence.json",
              root / "frozen_reference" / "alerce_reference_frozen_20200609" / "evidence_manifest.json",
              root / "frozen_reference" / "ztf_periodic_730k_published" / "evidence_manifest.json",
          ):
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit(f"invalid scientific evidence manifest: {path}")
              if payload.get("immutable") is False:
                  raise SystemExit(f"scientific evidence is not immutable: {path}")

          print("scientific_gate=PASS")
          print("release evidence is bound to the successful Scientific Validation workflow-run artifacts")
          PY
          fi

      - name: Require curated release notes
        if: steps.ref.outputs.existing_immutable != 'true'
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if [ ! -s "$notes" ]; then
            echo "Missing curated release notes: $notes"
            echo "Every GitHub Release must have a release-specific, committed release-note file."
            exit 1
          fi
          echo "Using curated release notes: $notes"

      - name: Run release validation
        if: steps.ref.outputs.existing_immutable != 'true'
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          python -m pip check
          python -m ruff check src tests
          if [[ "$RELEASE_TAG" != "v0.5.0" && "$RELEASE_TAG" != "v0.5.0-release" ]]; then
            git fetch origin main --depth=2
            mapfile -t files < <(git diff --name-only HEAD^...HEAD -- 'src/**/*.py' 'tests/**/*.py')
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No changed Python source/test files require formatting validation."
            else
              python -m ruff format --check "${files[@]}"
            fi
          fi
          python -m pytest -q
          python -m build

      - name: Detect existing GitHub release
        if: steps.ref.outputs.existing_immutable != 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null || true)"
          # gh api can return a JSON error object on some runner/API paths;
          # only a payload with a real release id and matching tag is a release.
          if [ -z "$j" ] || ! jq -e --arg tag "$RELEASE_TAG" '.id and .tag_name == $tag' <<<"$j" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing release for $RELEASE_TAG"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "immutable=$(jq -r '.immutable // false' <<<"$j")" >> "$GITHUB_OUTPUT"
          echo "assets=$(jq '.assets | length' <<<"$j")" >> "$GITHUB_OUTPUT"

      - name: Create new release with assets
        if: steps.ref.outputs.existing_immutable != 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --notes-file ".github/release-notes/${RELEASE_TAG}.md"

      - name: Repair existing mutable release in place
        if: steps.ref.outputs.existing_immutable != 'true' && steps.existing.outputs.exists == 'true' && steps.existing.outputs.immutable != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file ".github/release-notes/${RELEASE_TAG}.md"

      - name: Accept already-complete immutable release
        if: steps.ref.outputs.existing_immutable == 'true' || (steps.existing.outputs.exists == 'true' && steps.existing.outputs.immutable == 'true')
        run: |
          test "${{ steps.ref.outputs.asset_count }}" -ge 2
          echo "Immutable release is already complete; no mutation attempted."

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(printf '%s' "$j" | jq -r .draft)" = false
          test "$(printf '%s' "$j" | jq '.assets|length')" -ge 2
          echo "RELEASE VERIFIED: $RELEASE_TAG"
