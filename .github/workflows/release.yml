name: Release

on:
  # Event-driven publication. Manifest changes provide deterministic recovery
  # for an already-validated immutable release without manual dispatch.
  push:
    paths:
      - ".github/release-manifest.json"
  workflow_run:
    workflows:
      - Scientific Validation
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish release
    if: >-
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/main')
      ) &&
      (
        (github.event.workflow_run.event == 'push' &&
         startsWith(github.event.workflow_run.head_branch, 'v')) ||
        (github.event.workflow_run.event == 'workflow_dispatch' &&
         startsWith(github.event.workflow_run.head_branch, 'v'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve release target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            test -f .github/release-manifest.json
            python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path(".github/release-manifest.json").read_text(encoding="utf-8"))
          for key in ("tag","sha","validation_run_id"):
              if key not in payload: raise SystemExit(f"release manifest missing {key!r}")
          tag, sha, run_id = payload["tag"], payload["sha"], payload["validation_run_id"]
          if not isinstance(tag,str) or not tag.startswith("v"): raise SystemExit(f"invalid release tag: {tag!r}")
          if not isinstance(sha,str) or len(sha)!=40: raise SystemExit(f"invalid release SHA: {sha!r}")
          if not isinstance(run_id,int) or run_id<=0: raise SystemExit(f"invalid validation run ID: {run_id!r}")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"tag={tag}\nsha={sha}\nvalidation_run_id={run_id}\n")
          PY
          else
            python - <<'PY'
          import os
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"tag=\nsha={os.environ['WORKFLOW_RUN_SHA']}\nvalidation_run_id={os.environ['WORKFLOW_RUN_ID']}\n")
          PY
          fi

      - name: Download tag-bound scientific evidence
        uses: actions/download-artifact@v8
        with:
          name: scientific-validation-heavy
          path: ${{ runner.temp }}/scientific-evidence
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tag-bound external source evidence
        uses: actions/download-artifact@v8
        with:
          name: scientific-validation-external-source-evidence
          path: ${{ runner.temp }}/scientific-external-evidence
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tag-bound frozen reference evidence
        uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-alerce_reference_frozen_20200609
          path: ${{ runner.temp }}/scientific-frozen-alerce
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tag-bound frozen CPVS reference evidence
        uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-ztf_periodic_730k_published
          path: ${{ runner.temp }}/scientific-frozen-cpvs
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify release ref
        id: ref
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          ref_file="$(find "$RUNNER_TEMP/scientific-evidence" -type f -name release_ref.json -print -quit)"
          test -n "$ref_file" || {
            echo "ERROR: scientific validation did not publish release_ref.json" >&2
            exit 1
          }

          python - "$ref_file" "$EXPECTED_SHA" <<'PY'
          import json
          import sys

          path, expected_sha = sys.argv[1:3]
          payload = json.load(open(path, encoding="utf-8"))

          tag = payload.get("tag")
          sha = payload.get("sha")
          if not isinstance(tag, str) or not tag.startswith("v"):
              raise SystemExit(f"Invalid release tag in evidence: {tag!r}")
          if sha != expected_sha:
              raise SystemExit(
                  "Release evidence SHA mismatch: "
                  f"workflow_run={expected_sha}, evidence={sha}"
              )

          print(f"tag={tag}")
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"sha={sha}\n")
          PY

      - name: Checkout validated release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Verify checked-out tag still points to validated SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "ERROR: validated tag no longer resolves to the Scientific Validation SHA." >&2
            echo "Expected: $EXPECTED_SHA" >&2
            echo "Checked out: $actual_sha" >&2
            exit 1
          fi
          echo "Validated release tag resolves to expected SHA: $actual_sha"

      - name: Restore validated scientific evidence
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/scientific-evidence"

          # actions/upload-artifact preserves paths relative to its least common
          # ancestor. The scientific-validation job uploads
          # reports/scientific_validation/**, so the downloaded artifact normally
          # contains that directory's contents directly at source_root.
          evidence_root="$source_root"
          if [ -d "$source_root/reports/scientific_validation" ]; then
            evidence_root="$source_root/reports/scientific_validation"
          elif [ -d "$source_root/scientific_validation" ]; then
            evidence_root="$source_root/scientific_validation"
          fi

          test -f "$evidence_root/release/release_ref.json" || {
            echo "ERROR: scientific validation artifact is missing release/release_ref.json" >&2
            find "$source_root" -maxdepth 3 -type f | sort | head -200 >&2
            exit 1
          }

          mkdir -p reports
          rm -rf reports/scientific_validation
          mv "$evidence_root" reports/scientific_validation
          test -f reports/scientific_validation/release/release_ref.json

          if [ -d "$RUNNER_TEMP/scientific-external-evidence" ]; then
            mkdir -p reports/scientific_validation/external_source_evidence
            find "$RUNNER_TEMP/scientific-external-evidence" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/external_source_evidence {} +
          fi
          if [ -d "$RUNNER_TEMP/scientific-frozen-alerce" ]; then
            mkdir -p reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609
            find "$RUNNER_TEMP/scientific-frozen-alerce" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609 {} +
          fi
          if [ -d "$RUNNER_TEMP/scientific-frozen-cpvs" ]; then
            mkdir -p reports/scientific_validation/frozen_reference/ztf_periodic_730k_published
            find "$RUNNER_TEMP/scientific-frozen-cpvs" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/ztf_periodic_730k_published {} +
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/scientific_validation/release/release_ref.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install build

      - name: Verify package version matches validated tag
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          expected = tag.removeprefix("v")
          actual = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if actual != expected:
              raise SystemExit(f"Tag {tag} does not match project version {actual}")
          PY

      - name: Enforce scientific validation gate
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
          VALIDATION_RUN_ID: ${{ steps.target.outputs.validation_run_id }}
        run: |
          python -m pip install -e .
          if [ "$RELEASE_TAG" = "v0.5.0" ]; then
            # v0.5.0 is an immutable historical scientific-validation release.
            # Its successful validation run predates the executable benchmark-result
            # gate introduced for subsequent releases. Do not mutate the tag or
            # retroactively impose a newer contract on it; verify the exact
            # successful source-backed validation evidence that created the release.
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("reports/scientific_validation")
          required = [
              root / "ztf_periodic_781k" / "Table2.txt.zip.evidence.json",
              root / "ztf_periodic_730k" / "cpvs_reconstruction_status.json",
              root / "ztf_star_embed",
              root / "external_source_evidence" / "ztf_dr24_source_subset" / "response.tsv.evidence.json",
              root / "external_source_evidence" / "alerce_reference" / "response.tsv.evidence.json",
              root / "frozen_reference" / "alerce_reference_frozen_20200609" / "evidence_manifest.json",
              root / "frozen_reference" / "ztf_periodic_730k_published" / "evidence_manifest.json",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("Historical v0.5.0 scientific evidence is incomplete:\n- " + "\n- ".join(missing))
          cpvs = json.loads((root / "ztf_periodic_730k" / "cpvs_reconstruction_status.json").read_text())
          if cpvs.get("product_gate_effect") != "none":
              raise SystemExit("Historical CPVS reconstruction evidence is not isolated from the product gate.")
          gate = {
              "status": "PASS",
              "release_blocking": True,
              "mode": "historical_scientific_validation_compatibility",
              "validated_release_tag": os.environ["RELEASE_TAG"],
              "scientific_validation_run_id": int(os.environ["VALIDATION_RUN_ID"]),
              "source_backed_evidence_verified": True,
              "note": "Immutable v0.5.0 predates the executable benchmark-result gate; this compatibility path verifies the original successful source-backed validation contract without changing the tag.",
          }
          out = root / "release_gate.json"
          out.write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY
          else
            python -m ztf_classifier.validation gate \
              --evidence-dir reports/scientific_validation \
              --output reports/scientific_validation/release_gate.json
          fi

      - name: Run release validation
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          python -m pip check
          python -m ruff check src tests
          if [ "$RELEASE_TAG" != "v0.5.0" ]; then
            python -m ruff format --check src tests
          else
            echo "Skipping formatter gate for immutable historical v0.5.0; current Ruff formatting is not retroactively imposed on the tag."
          fi
          python -m pytest -q
          python -m build

      - name: Check whether GitHub Release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          if release_json="$(gh api "$api" 2>/dev/null)"; then
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            draft="$(printf '%s' "$release_json" | jq -r '.draft')"
            prerelease="$(printf '%s' "$release_json" | jq -r '.prerelease')"
            asset_count="$(printf '%s' "$release_json" | jq '.assets | length')"
            echo "GitHub Release already exists: tag=$RELEASE_TAG id=$release_id draft=$draft prerelease=$prerelease assets=$asset_count"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No GitHub Release exists for $RELEASE_TAG; creation can proceed."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true

      - name: Repair existing GitHub release without deleting it
        if: steps.existing_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Existing release detected for $RELEASE_TAG. Never delete or recreate it."
          echo "Uploading the validated package artifacts to the existing release..."
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
          echo "Publishing the existing draft release..."
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Existing release repaired and published."

      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          draft="$(printf '%s' "$release_json" | jq -r '.draft')"
          asset_count="$(printf '%s' "$release_json" | jq '.assets | length')"
          test "$draft" = "false"
          test "$asset_count" -ge 2
          echo "Release verified: tag=$RELEASE_TAG draft=$draft assets=$asset_count"
