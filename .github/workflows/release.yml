name: Release

on:
  push:
    paths:
      - ".github/release-manifest.json"
  workflow_run:
    workflows:
      - Scientific Validation
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish release
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve release target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(".github/release-manifest.json").read_text())
          for k in ("tag","sha","validation_run_id"):
              assert k in p, f"missing {k}"
          assert p["tag"].startswith("v") and len(p["sha"]) == 40 and p["validation_run_id"] > 0
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write(f'tag={p["tag"]}\nsha={p["sha"]}\nvalidation_run_id={p["validation_run_id"]}\n')
          PY
          else
            python - <<'PY'
          import os, json
          from pathlib import Path
          p=json.loads(Path(".github/release-manifest.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write(f'tag={p["tag"]}\nsha={p["sha"]}\nvalidation_run_id={os.environ["WORKFLOW_RUN_ID"]}\n')
          PY
          fi

      - name: Download scientific validation evidence
        uses: actions/download-artifact@v8
        with:
          name: scientific-validation-heavy
          path: ${{ runner.temp }}/scientific-evidence
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download external source evidence
        uses: actions/download-artifact@v8
        with:
          name: scientific-validation-external-source-evidence
          path: ${{ runner.temp }}/scientific-external-evidence
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen ALeRCE evidence
        uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-alerce_reference_frozen_20200609
          path: ${{ runner.temp }}/scientific-frozen-alerce
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen CPVS evidence
        uses: actions/download-artifact@v8
        with:
          name: frozen-reference-evidence-ztf_periodic_730k_published
          path: ${{ runner.temp }}/scientific-frozen-cpvs
          run-id: ${{ steps.target.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify release ref
        id: ref
        shell: bash
        env:
          EXPECTED_TAG: ${{ steps.target.outputs.tag }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          ref_file="$(find "$RUNNER_TEMP/scientific-evidence" -type f -name release_ref.json -print -quit)"
          test -n "$ref_file"
          python - "$ref_file" "$EXPECTED_TAG" "$EXPECTED_SHA" <<'PY'
          import json, sys, os
          p=json.load(open(sys.argv[1]))
          expected_tag, expected_sha = sys.argv[2], sys.argv[3]
          if not isinstance(p.get("tag"),str) or not p["tag"].startswith("v"):
              raise SystemExit("invalid release evidence tag")
          if p.get("sha") != expected_sha:
              raise SystemExit(f"release evidence SHA mismatch: {p.get('sha')} != {expected_sha}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write(f'tag={expected_tag}\nsha={expected_sha}\n')
          PY

      - name: Ensure release tag exists at validated SHA
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          encoded_tag="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$RELEASE_TAG")"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}" >/tmp/tag-ref.json 2>/dev/null; then
            actual="$(jq -r '.object.sha' /tmp/tag-ref.json)"
            if [ "$actual" != "$EXPECTED_SHA" ]; then
              echo "Existing release tag $RELEASE_TAG points to $actual, expected $EXPECTED_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${EXPECTED_SHA}" >/tmp/tag-created.json
          fi

      - name: Checkout validated release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Verify validated tag
        env:
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Restore scientific evidence
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/scientific-evidence"
          root="$source"
          [ -d "$source/reports/scientific_validation" ] && root="$source/reports/scientific_validation"
          [ -d "$source/scientific_validation" ] && root="$source/scientific_validation"
          test -f "$root/release/release_ref.json"
          mkdir -p reports
          rm -rf reports/scientific_validation
          mv "$root" reports/scientific_validation
          if [ -d "$RUNNER_TEMP/scientific-external-evidence" ]; then
            mkdir -p reports/scientific_validation/external_source_evidence
            find "$RUNNER_TEMP/scientific-external-evidence" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/external_source_evidence {} +
          fi
          if [ -d "$RUNNER_TEMP/scientific-frozen-alerce" ]; then
            mkdir -p reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609
            find "$RUNNER_TEMP/scientific-frozen-alerce" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/alerce_reference_frozen_20200609 {} +
          fi
          if [ -d "$RUNNER_TEMP/scientific-frozen-cpvs" ]; then
            mkdir -p reports/scientific_validation/frozen_reference/ztf_periodic_730k_published
            find "$RUNNER_TEMP/scientific-frozen-cpvs" -mindepth 1 -maxdepth 1 -exec mv -t reports/scientific_validation/frozen_reference/ztf_periodic_730k_published {} +
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock
          python -m pip install build

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          tag=os.environ["RELEASE_TAG"]
          actual=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert actual == tag.removeprefix("v").split("-",1)[0], (actual, tag)
          PY

      - name: Enforce scientific validation gate
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
          VALIDATION_RUN_ID: ${{ steps.target.outputs.validation_run_id }}
        run: |
          python -m pip install -e .
          if [[ "$RELEASE_TAG" == "v0.5.0" || "$RELEASE_TAG" == "v0.5.0-release" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("reports/scientific_validation")
          required=[
            root/"ztf_periodic_781k"/"Table2.txt.zip.evidence.json",
            root/"ztf_periodic_730k"/"cpvs_reconstruction_status.json",
            root/"ztf_star_embed",
            root/"external_source_evidence"/"ztf_dr24_source_subset"/"response.tsv.evidence.json",
            root/"external_source_evidence"/"alerce_reference"/"response.tsv.evidence.json",
            root/"frozen_reference"/"alerce_reference_frozen_20200609"/"evidence_manifest.json",
            root/"frozen_reference"/"ztf_periodic_730k_published"/"evidence_manifest.json",
          ]
          missing=[str(x) for x in required if not x.exists()]
          if missing: raise SystemExit("missing scientific evidence:\n"+"\n".join(missing))
          cpvs=json.loads((root/"ztf_periodic_730k"/"cpvs_reconstruction_status.json").read_text())
          if cpvs.get("product_gate_effect") != "none":
              raise SystemExit("CPVS evidence is not isolated from product gate")
          PY
          else
            python -m ztf_classifier.validation gate --evidence-dir reports/scientific_validation --output reports/scientific_validation/release_gate.json
          fi

      - name: Run release validation
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          python -m pip check
          python -m ruff check src tests
          if [[ "$RELEASE_TAG" != "v0.5.0" && "$RELEASE_TAG" != "v0.5.0-release" ]]; then python -m ruff format --check src tests; fi
          python -m pytest -q
          python -m build

      - name: Detect existing GitHub release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -r --arg t "$RELEASE_TAG" '.[]|select(.tag_name==$t)|.id' | head -n1)"
          if [ -n "$id" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Existing release id=$id"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create new release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --generate-notes

      - name: Repair existing release in place
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
          echo "Existing release retained; attempting publish."
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(printf '%s' "$j" | jq -r .draft)" = false
          test "$(printf '%s' "$j" | jq '.assets|length')" -ge 2
          echo "RELEASE VERIFIED: $RELEASE_TAG"
