name: Windows Desktop Shell Spike

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/ztf_classifier/desktop/**"
      - "src/ztf_classifier/web/static/app.js"
      - "tests/test_desktop_runtime.py"
      - ".github/workflows/windows-desktop-shell-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-shell-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows runtime tests and one-folder build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and desktop extras
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.48.0
          python -m pip install -e ".[dev,desktop-windows,desktop-build]"

      - name: Verify dependency environment
        run: python -m pip check

      - name: Run desktop runtime tests
        run: python -m pytest -q tests/test_desktop_runtime.py

      - name: Validate Workbench JavaScript syntax
        run: node --check src/ztf_classifier/web/static/app.js

      - name: Run Ruff checks
        run: |
          python -m ruff check src/ztf_classifier/desktop tests/test_desktop_runtime.py
          python -m ruff format --check src/ztf_classifier/desktop tests/test_desktop_runtime.py

      - name: Build Windows one-folder application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ZTFClassifier --collect-all webview --collect-all pythonnet --collect-all clr_loader --add-data "src/ztf_classifier/web/static;ztf_classifier/web/static" --add-data "configs/benchmarks;configs/benchmarks" src/ztf_classifier/desktop/main.py
          if (-not (Test-Path "dist/ZTFClassifier/ZTFClassifier.exe")) {
            throw "PyInstaller did not create the expected Windows executable."
          }
          python -m pip freeze --all | Out-File -Encoding utf8 "dist/desktop-windows-dependencies.txt"

      - name: Upload unsigned engineering build
        uses: actions/upload-artifact@v6
        with:
          name: ztf-classifier-windows-desktop-shell-spike-${{ github.sha }}
          path: |
            dist/ZTFClassifier/
            dist/desktop-windows-dependencies.txt
          if-no-files-found: error
          retention-days: 14
